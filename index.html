<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000">
<title>Astra X</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%23000'/%3E%3Ccircle cx='256' cy='256' r='140' fill='none' stroke='%23fff' stroke-width='36'/%3E%3Ccircle cx='256' cy='256' r='44' fill='%23fff'/%3E%3C/svg%3E" type="image/svg+xml">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%23000'/%3E%3Ccircle cx='256' cy='256' r='140' fill='none' stroke='%23fff' stroke-width='36'/%3E%3C/svg%3E">

<script src="https://js.puter.com/v2/"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>

<style>
:root{
  --bg:#000000;
  --side:#0a0a0a;
  --sur:#171717;
  --hov:#262626;
  --b:#262626;
  --t:#ececec;
  --m:#8e8e93;
  --inv-bg:#ffffff;
  --inv-t:#000000;
}
:root[data-theme="light"]{
  --bg:#ffffff;
  --side:#f9f9f9;
  --sur:#f2f2f2;
  --hov:#e5e5e5;
  --b:#e5e5e5;
  --t:#0d0d0d;
  --m:#6b6b6b;
  --inv-bg:#0d0d0d;
  --inv-t:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;width:100%;overflow:hidden;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;user-select:none}
svg{display:block;flex-shrink:0}
:focus-visible{outline:1.5px solid var(--t);outline-offset:2px;border-radius:8px}

/* ===== MONOCHROME SIDEBAR ===== */
#side{width:265px;background:var(--side);border-right:1px solid var(--b);display:flex;flex-direction:column;flex-shrink:0;z-index:40;will-change:transform;transition:transform .22s cubic-bezier(.22,1,.36,1)}
.brand-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px}
.new-btn{flex:1;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:500;background:var(--sur);border:1px solid var(--b)}
.new-btn:hover{background:var(--hov)}
.ssearch{margin:6px 12px;padding:8px 12px;border-radius:10px;background:var(--sur);border:1px solid var(--b);color:var(--t);font-size:13px;outline:0;width:calc(100% - 24px)}
.lab{font-size:11px;color:var(--m);padding:12px 16px 4px;font-weight:600}
#list{flex:1;overflow-y:auto;padding:0 8px;-webkit-overflow-scrolling:touch}
.ci{display:flex;align-items:center;padding:9px 10px;border-radius:10px;font-size:13.5px;cursor:pointer;gap:8px;margin-bottom:2px;color:var(--m)}
.ci:hover,.ci.on{background:var(--sur);color:var(--t)}
.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci b{font-weight:400;opacity:.6;padding:0 4px}
.ci b:hover{opacity:1;color:var(--t)}

.sfoot{padding:8px;border-top:1px solid var(--b);display:flex;flex-direction:column;gap:2px}
details.sdrop{border-radius:10px}
details.sdrop summary{padding:9px 10px;font-size:13px;font-weight:500;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;border-radius:10px;color:var(--m)}
details.sdrop summary::-webkit-details-marker{display:none}
details.sdrop summary:hover{background:var(--sur);color:var(--t)}
.sdrop-list{display:flex;flex-direction:column;gap:2px;padding:4px 0 4px 8px;max-height:32vh;overflow-y:auto}
.srow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;text-align:left;color:var(--t)}
.srow:hover{background:var(--sur)}

/* ===== ULTRA-CLEAN CHATGPT HEADER (NO OVERLAP) ===== */
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{height:52px;display:grid;grid-template-columns:40px 1fr 80px;align-items:center;padding:0 10px;flex-shrink:0;border-bottom:1px solid var(--b);background:var(--bg);z-index:15}
.hcenter{display:flex;justify-content:center;min-width:0}
.hright{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.ibtn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--t)}
.ibtn:hover{background:var(--sur)}
.model-wrap{display:inline-flex;align-items:center;max-width:100%;padding:6px 12px;border-radius:10px}
.model-wrap:hover{background:var(--sur)}
#model{background:transparent;color:var(--t);border:0;font-weight:600;font-size:15px;outline:0;max-width:52vw;text-overflow:ellipsis;text-align:center;appearance:none;-webkit-appearance:none;cursor:pointer}
#model option{background:var(--side);color:var(--t)}
#menu{display:none}

/* ===== WORKSPACE & CHAT STREAM ===== */
#workspace{flex:1;display:flex;min-height:0;overflow:hidden;position:relative}
#chat{flex:1;overflow-y:auto;padding:20px 16px 28px;min-width:0;-webkit-overflow-scrolling:touch}
#in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
#jumpBtn{position:absolute;bottom:16px;right:18px;background:var(--sur);border:1px solid var(--b);color:var(--t);width:36px;height:36px;border-radius:50%;display:none;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:20}
#jumpBtn.show{display:flex}

.urow{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.u{background:var(--sur);padding:10px 16px;border-radius:20px;max-width:85%;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere;font-size:15.5px}
.fchip{display:inline-block;margin-top:6px;font-size:12px;background:var(--hov);color:var(--t);padding:3px 9px;border-radius:8px}

.arow{display:flex;flex-direction:column;gap:6px}
.a{line-height:1.7;font-size:15.5px;overflow-wrap:anywhere;min-width:0}
.a p{margin-bottom:12px}.a ul,.a ol{padding-left:22px;margin-bottom:12px}.a a{color:var(--t);text-decoration:underline}
.a img{max-width:100%;border-radius:12px;margin:6px 0}
.a table{border-collapse:collapse;display:block;overflow-x:auto;margin-bottom:12px;font-size:13.5px}.a td,.a th{border:1px solid var(--b);padding:7px 11px}
.a :not(pre)>code{background:var(--sur);border:1px solid var(--b);padding:1.5px 6px;border-radius:6px;font-size:.86em;font-family:ui-monospace,Menlo,monospace;word-break:break-word}
.acts{display:flex;gap:8px;font-size:12px;color:var(--m);align-items:center;flex-wrap:wrap}
.acts button{padding:4px 8px;border-radius:6px}
.acts button:hover{background:var(--sur);color:var(--t)}

/* ===== MONOCHROME COMPACT CODE CARDS ===== */
.cb{margin:12px 0;border:1px solid var(--b);border-radius:12px;overflow:hidden;background:#0a0a0a}
.cbar{display:flex;gap:6px;align-items:center;padding:8px 12px;background:#141414;border-bottom:1px solid #262626;flex-wrap:wrap}
.clang{margin-right:auto;font-size:11px;color:#8e8e93;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;font-weight:600}
.cp{font-size:11.5px;background:#262626;color:#ececec;padding:4px 10px;border-radius:6px;font-weight:500}
.cp:hover{background:#363636}
.cp.ac{background:#ffffff;color:#000000}
.cb pre{color:#ececec;padding:12px 14px;overflow-x:auto;font-size:12.5px;line-height:1.55;max-height:320px;overflow-y:auto;margin:0}
.cb.collapsed pre{max-height:130px;overflow:hidden;mask-image:linear-gradient(180deg,#000 55%,transparent);-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent)}
.cb-exp{width:100%;text-align:center;padding:7px;font-size:12px;color:#ececec;background:#111111;border-top:1px solid #222222;font-weight:500;display:none}
.cb.collapsed .cb-exp{display:block}
.cb pre code{background:none;padding:0;font-family:ui-monospace,Menlo,monospace}
.ro{background:#050505;color:#d4d4d8;font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;border-top:1px solid #262626}
.ro[hidden]{display:none}

/* ===== MINIMAL THINKING PILL ===== */
details.th{border:1px solid var(--b);border-radius:12px;margin-bottom:8px;font-size:12.5px;color:var(--m);background:var(--sur);overflow:hidden}
details.th summary{padding:8px 12px;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;font-weight:500}
details.th summary::-webkit-details-marker{display:none}
.pbar-wrap{height:2px;width:100%;background:var(--b);overflow:hidden}
.pbar{height:100%;width:20%;background:var(--t);transition:width .25s ease}
.done .pbar{width:100%!important}
.dot{width:7px;height:7px;border-radius:50%;background:var(--t);animation:p 1s infinite}
.done .dot{animation:none}
@keyframes p{50%{opacity:.25}}
.st{padding:8px 14px 10px;border-top:1px solid var(--b);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow-y:auto}
.cur{display:inline-block;width:7px;height:15px;background:var(--t);vertical-align:middle;margin-left:2px;animation:p .8s infinite}

/* ===== CLEAN CHATGPT-STYLE EMPTY STATE ===== */
#hello{text-align:center;padding:8vh 12px 0;max-width:560px;margin:0 auto}
.logo-circle{width:46px;height:46px;border-radius:50%;background:var(--inv-bg);color:var(--inv-t);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px}
#hello h1{font-size:23px;font-weight:600;margin-bottom:22px;letter-spacing:-.2px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.chips button{border:1px solid var(--b);border-radius:14px;padding:13px 14px;background:transparent;text-align:left;line-height:1.35;display:flex;flex-direction:column;gap:3px;transition:background .15s}
.chips button:hover{background:var(--sur)}
.chips button b{font-size:13.5px;font-weight:600;color:var(--t)}
.chips button span{font-size:12px;color:var(--m)}
@media(max-width:520px){.chips{grid-template-columns:1fr}#hello{padding-top:4vh}}

/* ===== PURE CHATGPT BOTTOM INPUT BAR (NO CRAMPING) ===== */
footer{padding:6px 12px calc(12px + env(safe-area-inset-bottom,0px));flex-shrink:0;position:relative}
#file{max-width:720px;margin:0 auto 6px;display:none}
#file div{display:inline-flex;align-items:center;gap:8px;background:var(--sur);border:1px solid var(--b);border-radius:10px;padding:5px 10px;font-size:12.5px}
#boxWrap{max-width:720px;margin:0 auto;position:relative}

#slashMenu{display:none;position:absolute;bottom:56px;left:0;right:0;max-width:440px;background:var(--side);border:1px solid var(--b);border-radius:14px;padding:6px;box-shadow:0 12px 36px rgba(0,0,0,.5);z-index:50;flex-direction:column;gap:2px}
#slashMenu.open{display:flex}
.sl-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:9px;font-size:13px;text-align:left}
.sl-item:hover{background:var(--sur)}
.sl-item code{color:var(--t);font-weight:700;font-family:ui-monospace,Menlo,monospace}
.sl-item span{color:var(--m);font-size:11.5px}

#box{background:var(--sur);border-radius:26px;padding:7px 9px;display:flex;align-items:flex-end;gap:8px;border:1px solid var(--b)}
.cbtn{width:36px;height:36px;border-radius:50%;background:var(--hov);color:var(--t);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cbtn:hover{opacity:.85}
#box textarea{flex:1;background:none;border:0;outline:0;color:var(--t);font:inherit;font-size:16px;resize:none;max-height:135px;padding:6px 2px;line-height:1.4;min-width:0}
#box textarea::placeholder{color:var(--m)}
#mic{background:transparent;color:var(--m)}
#mic:hover{color:var(--t);background:var(--hov)}
#mic.rec{background:var(--inv-bg);color:var(--inv-t)}
#send{width:36px;height:36px;border-radius:50%;background:var(--inv-bg);color:var(--inv-t);flex-shrink:0;display:flex;align-items:center;justify-content:center}

/* ===== UNIFIED MONOCHROME COMMAND SHEET ===== */
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:35}
#ov.open{display:block}
.mbk{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.mbk{align-items:center;padding:16px}}
.mbk.open{display:flex}
.mdl{background:var(--side);border:1px solid var(--b);border-radius:20px 20px 0 0;width:100%;max-width:740px;max-height:86dvh;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:640px){.mdl{border-radius:16px;max-height:84dvh}}
.mtop{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--b);font-size:15px;font-weight:600}
.ttabs{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--b);flex-shrink:0}
.stab{padding:7px 13px;border-radius:99px;font-size:12.5px;white-space:nowrap;color:var(--m);font-weight:500}
.stab.on{background:var(--inv-bg);color:var(--inv-t);font-weight:600}
.tpane{padding:16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:480px){.qgrid{grid-template-columns:1fr}}
.qcard{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--sur);border:1px solid var(--b);text-align:left;font-size:13px}
.qcard:hover{background:var(--hov)}
.qcard.on{border-color:var(--t)}
.qcard b{display:block;font-size:13.5px;color:var(--t);margin-bottom:2px}
.qcard span{font-size:11.5px;color:var(--m)}
.dot-ind{width:8px;height:8px;border-radius:50%;background:var(--b)}
.qcard.on .dot-ind{background:var(--t)}

.ti{width:100%;background:var(--sur);border:1px solid var(--b);border-radius:10px;padding:10px 12px;color:var(--t);font:inherit;font-size:13.5px;outline:0}
.ti:focus{border-color:var(--t)}
textarea.ti{resize:vertical;min-height:85px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.out2{background:#080808;color:#e5e5e5;border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;border:1px solid var(--b)}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row2 button{border:1px solid var(--b);border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:500;background:var(--sur)}
.row2 button:hover{background:var(--hov)}
.row2 button.pri{background:var(--inv-bg);color:var(--inv-t);border-color:transparent;font-weight:600}

.cvss-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:500px){.cvss-grid{grid-template-columns:1fr}}
.cvss-box{background:var(--sur);border:1px solid var(--b);border-radius:10px;padding:8px 10px}
.cvss-box label{font-size:11px;color:var(--m);font-weight:600;text-transform:uppercase;display:block;margin-bottom:4px}
.cvss-box select{width:100%;background:var(--side);border:1px solid var(--b);color:var(--t);padding:6px 8px;border-radius:8px;font-size:12.5px}

/* ===== SIDE-BY-SIDE LIVE CANVAS ===== */
#canvasPane{width:50%;border-left:1px solid var(--b);background:var(--side);display:none;flex-direction:column;z-index:25}
#canvasPane.open{display:flex}
.ctop{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--b);gap:6px;flex-wrap:wrap}
.ctop .ctitle{font-size:13px;font-weight:600}
.cbar2{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.cbar2 button{font-size:11.5px;padding:5px 10px;border-radius:8px;border:1px solid var(--b);background:var(--sur)}
.cbar2 button.pri{background:var(--inv-bg);color:var(--inv-t);border-color:transparent;font-weight:600}
#cBody{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#cFrame{flex:1;width:100%;border:0;background:#fff}
#cCode{flex:1;width:100%;border:0;background:#080808;color:#ececec;font:13px/1.5 ui-monospace,Menlo,monospace;padding:12px;resize:none;outline:0;display:none}
#cTerm{height:150px;background:#050505;color:#d4d4d8;font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px 12px;border-top:1px solid var(--b);overflow:auto;white-space:pre-wrap;display:none}

/* ===== MONOCHROME VOICE ORB ===== */
#orbM{display:none;position:fixed;inset:0;background:#000000;z-index:80;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;text-align:center;color:#fff}
#orbM.open{display:flex}
.orb{width:140px;height:140px;border-radius:50%;background:#ffffff;box-shadow:0 0 50px rgba(255,255,255,.35);animation:orbPulse 2.4s infinite ease-in-out;cursor:pointer}
.orb.listen{box-shadow:0 0 80px rgba(255,255,255,.75);transform:scale(1.08)}
@keyframes orbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#orbSub{max-width:520px;font-size:16px;color:#d4d4d8;line-height:1.5;min-height:48px}

#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--inv-bg);color:var(--inv-t);padding:8px 16px;border-radius:99px;font-size:12.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:opacity .3s}
.toast.out{opacity:0}
.mslot{margin:8px 0}.gm{max-width:100%;border-radius:12px;display:block}

@media print{
  #side,header,footer,#canvasPane,#jumpBtn,.acts,details.th{display:none!important}
  body,#main,#workspace,#chat{height:auto!important;overflow:visible!important;background:#fff!important;color:#000!important}
  .cb pre{max-height:none!important;overflow:visible!important;background:#f4f4f4!important;color:#000!important}
}
@media(max-width:900px){#canvasPane{position:fixed;inset:0;width:100%;border-left:0}}
@media(max-width:768px){#side{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%)}#side.open{transform:none}#menu{display:flex}}
</style>
</head>
<body>
<div id="ov"></div>
<div id="toasts" role="status" aria-live="polite"></div>

<!-- LIVE VOICE ORB OVERLAY -->
<div id="orbM" role="dialog" aria-modal="true" aria-label="Live Voice">
  <div style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:#8e8e93">Astra Live Voice</div>
  <div class="orb" id="orbCircle"></div>
  <div id="orbSub">Tap the circle and speak naturally…</div>
  <div class="row2">
    <button class="pri" id="orbToggleBtn">Start Listening</button>
    <button id="orbCloseBtn" style="border-color:#333;color:#fff;background:#171717">Close</button>
  </div>
</div>

<!-- CLEAN MONOCHROME SIDEBAR -->
<aside id="side">
  <div class="brand-bar">
    <button class="new-btn" id="new"><span>New chat</span><span style="color:var(--m);font-size:12px">⌘K</span></button>
  </div>
  <input class="ssearch" id="chatSearch" placeholder="Search chats…">
  <div class="lab">Chats</div>
  <div id="list"></div>

  <div class="sfoot">
    <details class="sdrop">
      <summary><span>Security & Cloud Suite</span><span>▾</span></summary>
      <div class="sdrop-list">
        <button class="srow" data-cmd="scope">Program Scope Parser</button>
        <button class="srow" data-cmd="bug">12-Vector Domain Blitz</button>
        <button class="srow" data-cmd="jslab">JS De-obfuscator & GraphQL</button>

  const beautified=decoded.replace(/;(?=\S)/g,";\n").replace(/\{(?=\S)/g,"{\n").replace(/\}(?=\S)/g,"}\n");

/* ===== JWT SECURITY AUDITOR & WEAK SECRET TESTER ===== */
async function auditJWT(token){
  const parts=token.trim().split(".");
  if(parts.length<2)return "Invalid JWT format (expected header.payload.signature)";
  const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/"))))),hdr=dec(parts[0]),pay=dec(parts[1]);
  const issues=[];
  if(!hdr.alg||/^none$/i.test(hdr.alg))issues.push("[CRITICAL] Algorithm is 'none' — signature verification bypass possible.");
  if(/^HS(256|384|512)$/i.test(hdr.alg))issues.push(`[INFO] Symmetric HMAC (${hdr.alg}) used — testing common weak secrets via WebCrypto...`);
  if(!pay.exp)issues.push("[MEDIUM] Token has no expiration ('exp') claim — token never expires.");
  else if(pay.exp*1000<Date.now())issues.push(`[INFO] Token expired at ${new Date(pay.exp*1000).toISOString()}.`);
  // Test common weak HMAC secrets client-side
  const commonSecrets=["secret","password","123456","admin","jwt_secret","key","supersecret","changeme","test","default","development"];
  let cracked=null;
  if(/^HS256$/i.test(hdr.alg)&&parts[2]){
    const enc=new TextEncoder(),msg=enc.encode(parts[0]+"."+parts[1]);
    for(const sec of commonSecrets){
      const key=await crypto.subtle.importKey("raw",enc.encode(sec),{name:"HMAC",hash:"SHA-256"},false,["sign"]);
      const sig=new Uint8Array(await crypto.subtle.sign("HMAC",key,msg));
      const b64url=btoa(String.fromCharCode(...sig)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
      if(b64url===parts[2]){cracked=sec;break}
    }
  }
  if(cracked)issues.push(`[CRITICAL] Weak HMAC Secret Cracked: "${cracked}"`);
  else if(/^HS256$/i.test(hdr.alg))issues.push("[OK] Signature did not match top default weak secrets.");
  return `HEADER:\n${JSON.stringify(hdr,null,2)}\n\nPAYLOAD:\n${JSON.stringify(pay,null,2)}\n\nSECURITY AUDIT:\n`+issues.join("\n");
}

/* ===== BUG BOUNTY PROGRAM SCOPE PARSER ===== */
function extractScopeDomains(rawText){
  const lines=rawText.split(/\n/);
  const inScope=[],outScope=[];
  let mode="in";
  for(const l of lines){
    if(/out[\s-]*of[\s-]*scope|excluded/i.test(l))mode="out";
    else if(/in[\s-]*scope|eligible|target/i.test(l))mode="in";
    const doms=[...l.matchAll(/(?:\*\.)?([a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)+)/g)].map(m=>m[1].toLowerCase()).filter(d=>!/\.(png|jpg|svg|js|css|json|md|txt|pdf|html)$/i.test(d));
    for(const d of doms){
      if(mode==="out")outScope.push(d);
      else inScope.push(d);
    }
  }
  const cleanIn=[...new Set(inScope)].filter(d=>!outScope.includes(d)).slice(0,6);
  return {inScope:cleanIn,outScope:[...new Set(outScope)]};
}

async function pollinations(msgs,model,onTok){

    const r=await withTimeout(fetch("https://text.pollinations.ai/openai",{

    if(r.ok){
      const j=await r.json();const t=j.choices?.[0]?.message?.content;
      if(t){onTok(t);return t}
    }
  }catch(_){}
  const last=plain[plain.length-1]?.content||"Hello";
  const r=await withTimeout(fetch("https://text.pollinations.ai/"+encodeURIComponent(last.slice(0,1500))+"?model="+(model||"openai")),30000,"Timeout");

async function routeStandardLLM(msgs,onTok){
  const m=S.model,chain=[];
  const add=(k,x)=>chain.push([k,x]);
  if(m==="auto"||m==="omni:deep"||m==="carbon:ultra"||m==="arena:consensus"||m==="swarm:redblue"){
    if(window.puter){add("pu","claude-sonnet-4-5");add("pu","gpt-4o")}
    add("pl","openai");add("gm","gemini-2.5-flash");add("pl","mistral");
  }else if(m.startsWith("gm:")){
    add("gm",gmId(m));if(window.puter)add("pu","gpt-4o");add("pl","openai");
  }else if(m.startsWith("pl:")){
    add("pl",m.slice(3));if(window.puter)add("pu","gpt-4o");add("pl","openai");
  }else{
    if(window.puter){add("pu",m);add("pu","gpt-4o")}
    add("pl","openai");add("gm","gemini-2.5-flash");
  }
  for(const [k,mod] of chain){
    if(stop)return "";
    try{return await callSingleBrain(k,mod,msgs,onTok)}catch(_){}
  }
  throw new Error("Cloud servers busy. Tap Retry.");
}

      preTelemetry=`\n\n[PRE-FETCHED 12-VECTOR PASSIVE RECON TELEMETRY FOR ${opts.blitzTargetDomain}]\n${data}\n\n[MANDATE: Analyze all 12 vectors above immediately and produce a complete HackerOne / Intigriti Security Assessment & Bug Bounty Report with CVSS v3.1 scores, CWE IDs, exposed endpoints/subdomains, CNAME takeover checks, header misconfigurations, Shodan CVE analysis, and exact remediation patches in ONE SHOT.]`;
    }else if(opts.blitzJsUrl){
      used+=2;pbar.style.width="50%";
      th.querySelector(".tt").textContent="De-obfuscating JS & extracting endpoints…";
      const data=await tools.js_deobfuscate(opts.blitzJsUrl);
      preTelemetry=`\n\n[PRE-FETCHED JS DE-OBFUSCATION & ENDPOINT TELEMETRY]\n${data}`;
    }else if(opts.blitzFuzzTarget){
      used+=3;pbar.style.width="55%";
      th.querySelector(".tt").textContent="Running Cloud Fuzzing Harness…";
      const data=await tools.cloud_fuzzer(opts.blitzFuzzTarget);
      preTelemetry=`\n\n[PRE-FETCHED CLOUD FUZZER TELEMETRY]\n${data}\n\n[MANDATE: Provide root-cause analysis, CWE ID, CVSS score, and a clean unified diff patch fixing any discovered issues.]`;
    }else if(opts.blitzOmniQuery&&S.blitzMode){
      used+=7;pbar.style.width="45%";
      const data=await tools.omni_blitz(opts.blitzOmniQuery,msg=>{th.querySelector(".tt").textContent=msg;log("▸ "+msg)});
      preTelemetry=`\n\n[PRE-FETCHED 2-HOP OMNI-WEB RESEARCH TELEMETRY]\n${data}\n\n[MANDATE: Use the live web research above to solve the user's request completely in ONE SHOT with full depth, working code, and zero placeholders.]`;
    }

    const work=[{role:"system",content:sysPrompt()},...c.msgs.slice(-14).map(toLLM)];
    if(preTelemetry){
      work[work.length-1]={...work[work.length-1],content:work[work.length-1].content+preTelemetry};
    }

    for(let i=0;i<=MAXSTEPS;i++){
      pbar.style.width=Math.min(92,35+i*15)+"%";
      th.querySelector(".tt").textContent=i===0?"Synthesizing complete solution…":`Executing Cloud Step ${i+1}…`;
      ans.innerHTML='<span class="cur"></span>';
      const out=await llm(work,streamRender);
      if(rafId){cancelAnimationFrame(rafId);rafId=null}
      const matches=[...out.matchAll(TOOLRE_G)];
      if(!matches.length||i===MAXSTEPS||stop){final=out.replace(TOOLRE_G,"").trim()||out;break}
      ans.innerHTML="";
      const results=await Promise.all(matches.map(async m=>{
        const [,name,inp]=m;used++;
        th.querySelector(".tt").textContent=`Running @${name} (Pipeline ${used})…`;
        log(`▸ @${name}: `+inp.trim().slice(0,140).replace(/\n/g," "));
        let res;
        try{res=await withTimeout(tools[name](inp),65000,"Timeout")}
        catch(e){res="ERROR: "+(e.message||e)}
        log("  → "+String(res).slice(0,200).replace(/\n/g," "));
        return "[TOOL RESULT: "+name+"]\n"+res;
      }));
      work.push({role:"assistant",content:out},{role:"user",content:results.join("\n\n")});
    }
    const htmlMatch=final.match(/```html\s*\n([\s\S]*?<!DOCTYPE html>[\s\S]*?)```/i);
    if(htmlMatch&&!$("#canvasPane").classList.contains("open"))openCanvas(htmlMatch[1],"html","App Preview");
    ans.innerHTML=md(final);dress(ans);addActs(row,final,myIndex);
    c.msgs.push({role:"assistant",content:final});
    if(S.autoSpeak&&final&&!stop)speakText(final,true);
  }catch(e){
    ans.innerHTML='<span style="color:#ef4444">Error: '+escapeHtml(e.message||"Connection error")+'</span> ';
    const rb=document.createElement("button");rb.className="cp";rb.textContent="Retry";rb.onclick=()=>{if(!busy){row.remove();runAgent(opts)}};ans.appendChild(rb);
  }
  clearInterval(tick);

  else th.remove();
  busy=false;$("#send").innerHTML=SEND_SVG;save();drawList();bottom();
  return final;
}

      const iss=1-((1-cV)*(1-iaV)*(1-iaV));
      const impact=6.42*iss,expl=8.22*avV*acV*prV*uiV;
      const score=iss<=0?0:Math.min(10,Math.ceil((impact+expl)*10)/10);
      const sev=score>=9?"CRITICAL":score>=7?"HIGH":score>=4?"MEDIUM":score>0?"LOW":"NONE";
      const vec=`CVSS:3.1/AV:${av}/AC:${ac}/PR:${pr}/UI:${ui}/S:U/C:${c}/I:${ia}/A:${ia}`;
      $("#cvOut").textContent=`${vec} — Score: ${score.toFixed(1)} (${sev})`;
      return {vec,score:score.toFixed(1),sev};
    };
    $("#cmdPane").querySelectorAll("select").forEach(s=>s.onchange=calc);
    calc();
    $("#cvCopyBtn").onclick=()=>{navigator.clipboard.writeText($("#cvOut").textContent);toast("CVSS Vector copied")};
    $("#cvGenBtn").onclick=()=>{
      const {vec,score,sev}=calc();
      const title=$("#cvTitle").value.trim()||"Security Vulnerability Finding";
      ask(`Write a complete HackerOne / Intigriti Bug Bounty Report for:\n- **Title:** ${title}\n- **Severity:** ${sev} (${score})\n- **Vector:** \`${vec}\`\n\nInclude: Summary, CWE ID, Affected Component, Verification Steps, Impact, and Remediation Patch.`);
    };
    $("#cvGhsaBtn").onclick=()=>{

    };
  },
  batch(){
    $("#cmdPane").innerHTML=`
      <div style="font-size:12.5px;color:var(--m)"><b>Multi-Target Autonomous Batch Queue:</b> Enter multiple domains or tasks (one per line) to run sequentially on autopilot.</div>

  Object.values(S.chats).sort((a,b)=>b.ts-a.ts).forEach(c=>{

const idb=new Promise((ok,no)=>{const r=indexedDB.open("agi_media",1);r.onupgradeneeded=()=>r.result.createObjectStore("m");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idbOp=(mode,fn)=>idb.then(db=>new Promise((ok,no)=>{const t=db.transaction("m",mode),q=fn(t.objectStore("m"));t.oncomplete=()=>ok(q.result);t.onerror=()=>no(t.error)}));
const mPut=(id,v)=>idbOp("readwrite",s=>s.put(v,id)),mGet=id=>idbOp("readonly",s=>s.get(id));
const newId=()=>"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const b64=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.readAsDataURL(b)});
async function normImg(f){const bm=await createImageBitmap(f),k=Math.min(1,1536/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,"image/jpeg",.9))}
async function fillSlots(root){

    pending={name:f.name,text:scanAndroidSource(ascii,f.name)+"\n\n[Extracted Printable Strings]\n"+ascii.slice(0,12000)};

const getKey=()=>localStorage.agi_gk||GEMINI_KEY||"";
const gmId=m=>m==="gm:custom"?(localStorage.agi_gm||"gemini-2.5-flash"):m.slice(3);
function gmReq(model,method,body,sig,forceAIza){
  const k=getKey(),aiza=forceAIza||k.startsWith("AIza"),sse=method==="streamGenerateContent";
  const u=(aiza?"https://generativelanguage.googleapis.com/v1beta/models/":"https://aiplatform.googleapis.com/v1/publishers/google/models/")+model+":"+method+(sse?"?alt=sse":"")+(aiza?"":(sse?"&":"?")+"key="+encodeURIComponent(k));
  return fetch(u,{method:"POST",headers:aiza?{"Content-Type":"application/json","x-goog-api-key":k}:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:sig});
}
async function gemini(msgs,model,onTok){
  const sys=msgs.filter(m=>m.role==="system").map(m=>m.content).join("\n"),contents=[];
  for(const m of msgs.filter(m=>m.role!=="system")){
    const parts=[{text:m.content||" "}];
    if(m.img){const r=await mGet(m.img);if(r?.b)parts.push({inlineData:{mimeType:"image/jpeg",data:await b64(await normImg(r.b))}})}
    contents.push({role:m.role==="assistant"?"model":"user",parts});
  }
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),60000);
  try{
    let r=await gmReq(model,"streamGenerateContent",{systemInstruction:{parts:[{text:sys}]},contents},ctl.signal,false);
    if(!r.ok&&!getKey().startsWith("AIza"))r=await gmReq(model,"streamGenerateContent",{systemInstruction:{parts:[{text:sys}]},contents},ctl.signal,true);
    if(!r.ok)throw new Error("Gemini HTTP "+r.status);
    const rd=r.body.getReader(),dec=new TextDecoder();let buf="",t="";
    for(;;){
      const {done,value}=await rd.read();if(done||stop)break;
      buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf("\n"))>=0){
        const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith("data:"))continue;
        try{const j=JSON.parse(line.slice(5));t+=(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||"").join("");onTok(t)}catch(_){}
      }
    }
    if(!t)throw new Error("Empty Gemini reply");
    return t;
  }finally{clearTimeout(to)}
}
