<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">

<title>ChatGPT 6 · Astra AGI v25.0</title>
<link rel="manifest" href="manifest.json">

<!-- External Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://js.puter.com/v2/"></script>

<style>
:root[data-theme="light"]{
  --bg:#ffffff;--side:#f9f9f9;--sur:#f4f4f4;--hov:#ececec;--b:#e5e5e5;
  --t:#0d0d0d;--m:#6e6e80;--ubg:#e8f0fe;--ut:#0d0d0d;
  --inv-bg:#0d0d0d;--inv-t:#ffffff;--accent:#2563eb;
  --ok:#16a34a;--warn:#ca8a04;--err:#dc2626;
  --shadow:0 10px 32px rgba(0,0,0,0.12);
}
:root[data-theme="dark"]{
  --bg:#000000;--side:#0a0a0a;--sur:#171717;--hov:#262626;--b:#262626;
  --t:#ececec;--m:#8e8e93;--ubg:#262626;--ut:#ececec;
  --inv-bg:#ffffff;--inv-t:#000000;--accent:#2563eb;
  --ok:#22c55e;--warn:#eab308;--err:#ef4444;
  --shadow:0 12px 36px rgba(0,0,0,0.65);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;width:100%;overflow:hidden;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;user-select:none}
svg{display:block;flex-shrink:0}

/* ═══════════ CHATGPT SIDEBAR ═══════════ */
#side{width:280px;background:var(--side);border-right:1px solid var(--b);display:flex;flex-direction:column;flex-shrink:0;z-index:45;transition:transform .24s cubic-bezier(.22,1,.36,1)}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.side-brand{font-size:19px;font-weight:700;letter-spacing:-.3px}
.side-icons{display:flex;align-items:center;gap:6px;color:var(--m)}
.ssearch-wrap{padding:0 12px 8px;display:none}
.ssearch-wrap.open{display:block}
.ssearch{width:100%;padding:8px 12px;border-radius:10px;background:var(--sur);border:1px solid var(--b);color:var(--t);font-size:13.5px;outline:0}

.snav{padding:0 10px;display:flex;flex-direction:column;gap:2px}
.snav-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:14.5px;font-weight:500;color:var(--t);text-align:left}
.snav-btn:hover,.snav-btn.active{background:var(--sur)}
.snav-btn svg{color:var(--t);opacity:.85}

#sideScroll{flex:1;overflow-y:auto;padding:6px 10px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--m);padding:14px 10px 6px;font-weight:600}
.sec-hdr button{color:var(--m);padding:2px 5px;border-radius:6px}
.sec-hdr button:hover{background:var(--sur);color:var(--t)}

.ci{display:flex;align-items:center;padding:9px 10px;border-radius:10px;font-size:14px;cursor:pointer;gap:8px;margin-bottom:2px;color:var(--t)}
.ci:hover,.ci.on{background:var(--sur)}
.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-acts{display:flex;align-items:center;gap:2px;opacity:.65}
.ci:hover .ci-acts{opacity:1}
.ci-btn{padding:3px 5px;border-radius:6px;font-size:12px;color:var(--m)}
.ci-btn:hover{background:var(--hov);color:var(--t)}

.sfoot{padding:10px 12px;border-top:1px solid var(--b);display:flex;flex-direction:column;gap:8px}
.user-row{display:flex;align-items:center;justify-content:space-between;padding:6px 4px;border-radius:10px;cursor:pointer}
.user-row:hover{background:var(--sur)}
.u-left{display:flex;align-items:center;gap:10px}
.u-avatar{width:34px;height:34px;border-radius:50%;background:#7c3aed;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.u-info b{display:block;font-size:14px;line-height:1.2}
.u-info span{font-size:12px;color:var(--m)}
.offer-pill{width:100%;padding:9px 12px;border-radius:99px;border:1px solid var(--b);background:var(--bg);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.offer-pill:hover{background:var(--sur)}

/* ═══════════ HEADER ═══════════ */
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;background:var(--bg);z-index:15}
.hleft,.hright{display:flex;align-items:center;gap:4px}
.ibtn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--t)}
.ibtn:hover{background:var(--sur)}
.model-wrap{display:inline-flex;align-items:center;padding:6px 10px;border-radius:10px;gap:4px}
.model-wrap:hover{background:var(--sur)}
#model{background:transparent;color:var(--t);border:0;font-weight:600;font-size:15px;outline:0;max-width:44vw;text-overflow:ellipsis;appearance:none;-webkit-appearance:none;cursor:pointer}
#model option{background:var(--bg);color:var(--t)}
.free-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;background:rgba(37,99,235,0.1);color:#2563eb;font-size:12.5px;font-weight:600}

/* ═══════════ WORKSPACE & CHAT ═══════════ */
#workspace{flex:1;display:flex;min-height:0;overflow:hidden;position:relative}
#chat{flex:1;overflow-y:auto;padding:16px 16px 24px;min-width:0}
#in{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
#jumpBtn{position:absolute;bottom:16px;right:18px;background:var(--bg);border:1px solid var(--b);color:var(--t);width:36px;height:36px;border-radius:50%;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:20}
#jumpBtn.show{display:flex}

/* User Bubble (Matches Screenshot 2) */
.urow{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.u{background:var(--ubg);color:var(--ut);padding:10px 16px;border-radius:20px;max-width:85%;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere;font-size:15.5px}
.u-imgs{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:4px}
.u-imgs img{width:120px;height:120px;object-fit:cover;border-radius:14px;border:1px solid var(--b)}
.fchip{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;background:var(--hov);color:var(--t);padding:4px 10px;border-radius:8px}

/* Assistant Row & Actions (Matches Screenshot 1 & 2) */
.arow{display:flex;flex-direction:column;gap:8px;position:relative}
.a{line-height:1.68;font-size:15.5px;overflow-wrap:anywhere;min-width:0}
.a p{margin-bottom:12px}.a ul,.a ol{padding-left:22px;margin-bottom:12px}.a a{color:var(--accent);text-decoration:underline}
.a img,.a video{max-width:100%;border-radius:14px;margin:8px 0;border:1px solid var(--b)}
.a table{border-collapse:collapse;display:block;overflow-x:auto;margin-bottom:12px;font-size:13.5px}.a td,.a th{border:1px solid var(--b);padding:7px 11px}
.a :not(pre)>code{background:var(--sur);border:1px solid var(--b);padding:1.5px 6px;border-radius:6px;font-size:.86em;font-family:ui-monospace,Menlo,monospace}

.acts{display:flex;gap:4px;color:var(--m);align-items:center;position:relative}
.act-icon{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--m)}
.act-icon:hover,.act-icon.on{background:var(--sur);color:var(--t)}

/* Floating "..." Popover Menu (Matches Screenshot 1) */
.more-pop{position:fixed;background:var(--bg);border:1px solid var(--b);border-radius:18px;padding:12px;min-width:230px;box-shadow:var(--shadow);z-index:85;display:none;flex-direction:column;gap:4px}
.more-pop.open{display:flex}
.mp-time{font-size:13px;color:var(--m);padding:4px 10px 8px;border-bottom:1px solid var(--b);margin-bottom:4px}
.mp-btn{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;font-size:14.5px;color:var(--t);text-align:left}
.mp-btn:hover{background:var(--sur)}

/* Code Cards */
.cb{margin:12px 0;border:1px solid var(--b);border-radius:12px;overflow:hidden;background:#0d0d0d;color:#ececec}
.cbar{display:flex;gap:6px;align-items:center;padding:8px 12px;background:#171717;border-bottom:1px solid #262626;flex-wrap:wrap}
.clang{margin-right:auto;font-size:11px;color:#8e8e93;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;font-weight:600}
.cp{font-size:11.5px;background:#262626;color:#ececec;padding:4px 10px;border-radius:6px;font-weight:500}
.cp:hover{background:#363636}
.cp.ac{background:#fff;color:#000}
.cb pre{color:#ececec;padding:12px 14px;overflow-x:auto;font-size:12.5px;line-height:1.55;max-height:340px;overflow-y:auto;margin:0}
.cb.collapsed pre{max-height:130px;overflow:hidden;mask-image:linear-gradient(180deg,#000 55%,transparent);-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent)}
.cb-exp{width:100%;text-align:center;padding:7px;font-size:12px;color:#ececec;background:#121212;border-top:1px solid #222;font-weight:500;display:none}
.cb.collapsed .cb-exp{display:block}
.ro{background:#050505;color:#d4d4d8;font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;border-top:1px solid #262626}
.ro[hidden]{display:none}

/* Thinking & Reasoning */
details.th{border:1px solid var(--b);border-radius:12px;margin-bottom:8px;font-size:12.5px;color:var(--m);background:var(--sur);overflow:hidden}
details.th summary{padding:8px 12px;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;font-weight:500}
details.th summary::-webkit-details-marker{display:none}
.pbar-wrap{height:2px;width:100%;background:var(--b);overflow:hidden}
.pbar{height:100%;width:20%;background:var(--accent);transition:width .25s ease}
.done .pbar{width:100%!important}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:p 1s infinite}
.done .dot{animation:none;background:var(--ok)}
@keyframes p{50%{opacity:.25}}
.st{padding:8px 14px 10px;border-top:1px solid var(--b);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.55;white-space:pre-wrap;max-height:180px;overflow-y:auto}
.cur{display:inline-block;width:7px;height:15px;background:var(--t);vertical-align:middle;margin-left:2px;animation:p .8s infinite}

.reasoning{padding:10px 14px;background:var(--sur);border-left:3px solid var(--accent);border-radius:8px;margin-bottom:10px;font-size:12.5px}
.reasoning .step{display:flex;gap:8px;margin-top:6px;align-items:flex-start}
.reasoning .num{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ═══════════ EMPTY STATE (Matches Screenshot 3) ═══════════ */
#hello{display:flex;flex-direction:column;justify-content:space-between;min-height:calc(100dvh - 210px);max-width:560px;margin:0 auto;padding:12vh 16px 12px}
#hello h1{font-size:26px;font-weight:600;text-align:center;letter-spacing:-.3px;margin:auto 0}
.home-actions{display:flex;flex-direction:column;gap:4px;margin-top:auto}
.h-act{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:12px;font-size:15.5px;color:var(--m);text-align:left}
.h-act:hover{background:var(--sur);color:var(--t)}
.h-act svg{color:var(--m)}

/* ═══════════ COMPOSER & + MENU (Matches Screenshots 1, 2, 3, 5) ═══════════ */
footer{padding:4px 12px calc(12px + env(safe-area-inset-bottom,0px));flex-shrink:0;position:relative}
.disclaimer{text-align:center;font-size:11.5px;color:var(--m);margin-bottom:6px}
#boxWrap{max-width:740px;margin:0 auto;position:relative}

/* Multi-attachment cards (Matches Screenshot 1 & 2) */
#attStrip{display:none;gap:10px;overflow-x:auto;padding:10px 12px 4px}
#attStrip.has{display:flex}
.att-card{position:relative;width:115px;height:135px;border-radius:14px;border:1px solid var(--b);background:var(--bg);overflow:hidden;flex-shrink:0;display:flex;flex-direction:column;justify-content:space-between;padding:8px;font-size:11px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.att-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.att-rm{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:#000;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:2}

/* ChatGPT "+" Popover Menu (Matches Screenshot 5) */
#plusMenu{display:none;position:absolute;bottom:calc(100% + 8px);left:0;right:0;max-width:420px;max-height:68dvh;overflow-y:auto;background:var(--bg);border:1px solid var(--b);border-radius:24px;padding:10px;box-shadow:var(--shadow);z-index:55;flex-direction:column;gap:2px}
#plusMenu.open{display:flex}
.pm-item{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:14px;text-align:left;font-size:14.5px}
.pm-item:hover{background:var(--sur)}
.pm-ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.pm-txt{flex:1;min-width:0}
.pm-txt b{font-weight:500;color:var(--t);margin-right:6px}
.pm-txt span{font-size:13px;color:var(--m)}
.pm-conn{font-size:13px;font-weight:600;color:var(--t)}
.pm-search{margin-top:6px;padding:10px 12px;border-top:1px solid var(--b);font-size:14px;color:var(--m);background:transparent;border-left:0;border-right:0;border-bottom:0;outline:0;width:100%}

/* Composer Pill Box */
#box{background:var(--sur);border-radius:26px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--b)}
#box textarea{width:100%;background:none;border:0;outline:0;color:var(--t);font:inherit;font-size:16px;resize:none;max-height:140px;padding:2px 4px;line-height:1.45}
#box textarea::placeholder{color:var(--m)}
.box-bot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.box-left,.box-right{display:flex;align-items:center;gap:6px}
.cbtn{width:36px;height:36px;border-radius:50%;color:var(--t);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cbtn:hover{background:var(--hov)}
.mode-Badge{font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(37,99,235,0.12);color:#2563eb;font-weight:600;display:none;align-items:center;gap:4px}
.mode-Badge.on{display:inline-flex}
#mic.rec{background:#ef4444;color:#fff}
#send{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .12s}
#send:active{transform:scale(.94)}

/* ═══════════ MODALS & CANVAS ═══════════ */
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
#ov.open{display:block}
.mbk{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:65;align-items:flex-end;justify-content:center}
@media(min-width:640px){.mbk{align-items:center;padding:16px}}
.mbk.open{display:flex}
.mdl{background:var(--bg);border:1px solid var(--b);border-radius:22px 22px 0 0;width:100%;max-width:760px;max-height:88dvh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
@media(min-width:640px){.mdl{border-radius:18px;max-height:85dvh}}
.mtop{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--b);font-size:15.5px;font-weight:600}
.ttabs{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--b);flex-shrink:0}
.stab{padding:7px 13px;border-radius:99px;font-size:12.5px;white-space:nowrap;color:var(--m);font-weight:500}
.stab.on{background:var(--inv-bg);color:var(--inv-t);font-weight:600}
.tpane{padding:16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:480px){.qgrid{grid-template-columns:1fr}}
.qcard{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--sur);border:1px solid var(--b);text-align:left;font-size:13px}
.qcard.on{border-color:var(--accent)}
.qcard b{display:block;font-size:13.5px;color:var(--t);margin-bottom:2px}
.qcard span{font-size:11.5px;color:var(--m)}
.dot-ind{width:8px;height:8px;border-radius:50%;background:var(--b)}
.qcard.on .dot-ind{background:var(--accent)}
.ti{width:100%;background:var(--sur);border:1px solid var(--b);border-radius:10px;padding:10px 12px;color:var(--t);font:inherit;font-size:13.5px;outline:0}
textarea.ti{resize:vertical;min-height:80px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.out2{background:#0a0a0a;color:#e5e5e5;border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;border:1px solid var(--b)}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row2 button{border:1px solid var(--b);border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:500;background:var(--sur)}
.row2 button.pri{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
.cvss-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cvss-box{background:var(--sur);border:1px solid var(--b);border-radius:10px;padding:8px 10px}
.cvss-box label{font-size:11px;color:var(--m);font-weight:600;text-transform:uppercase;display:block;margin-bottom:4px}
.cvss-box select{width:100%;background:var(--bg);border:1px solid var(--b);color:var(--t);padding:6px 8px;border-radius:8px;font-size:12.5px}

/* Canvas */
#canvasPane{width:50%;border-left:1px solid var(--b);background:var(--side);display:none;flex-direction:column;z-index:30}
#canvasPane.open{display:flex}
.ctop{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--b);gap:6px;flex-wrap:wrap}
.ctop .ctitle{font-size:13px;font-weight:600}
.cbar2{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.cbar2 button{font-size:11.5px;padding:5px 9px;border-radius:8px;border:1px solid var(--b);background:var(--sur)}
.cbar2 button.pri{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
#cBody{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#cFrame{flex:1;width:100%;border:0;background:#fff}
#cCode{flex:1;width:100%;border:0;background:#080808;color:#ececec;font:13px/1.5 ui-monospace,Menlo,monospace;padding:12px;resize:none;outline:0;display:none}
#cTerm{height:150px;background:#050505;color:#d4d4d8;font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px 12px;border-top:1px solid var(--b);overflow:auto;white-space:pre-wrap;display:none}

/* Live Voice Orb */

  const scored = S.mem.map(m => {
    const mText = String(m).toLowerCase();
    let score = 0;
    words.forEach(w => { if(mText.includes(w)) score++; });
    return { text: m, score };
  }).filter(m => m.score > 0).sort((a,b)=>b.score-a.score).slice(0, topK);
  return scored.map(s=>s.text).join("\n---\n");
}

/* Resilient Image Loader (Works even when fetch CORS fails) */
function loadPollinationsBitmap(promptText, w=960, h=540, seed=1){
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptText)}?width=${w}&height=${h}&nologo=true&seed=${seed}`;
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = async ()=>{
      try{
        const cv = document.createElement("canvas");
        cv.width = img.naturalWidth || w; cv.height = img.naturalHeight || h;
        cv.getContext("2d").drawImage(img, 0, 0);
        const blob = await new Promise(ok=>cv.toBlob(ok, "image/png"));
        resolve({ blob, url, bitmap: await createImageBitmap(img) });
      }catch(_){
        resolve({ blob: null, url, bitmap: null });
      }
    };
    img.onerror = ()=>reject(new Error("Image load error"));
    img.src = url;
  });
}

function bundleWebBlocks(markdownText){
  const htmlMatch = markdownText.match(/```html\s*\n([\s\S]*?)```/i);
  if(!htmlMatch) return null;
  let html = htmlMatch[1].trim();
  const cssBlocks = [...markdownText.matchAll(/```css\s*\n([\s\S]*?)```/gi)].map(m=>m[1].trim());
  const jsBlocks = [...markdownText.matchAll(/```(?:javascript|js)\s*\n([\s\S]*?)```/gi)].map(m=>m[1].trim());
  if(cssBlocks.length){
    const styleTag = `<style>\n${cssBlocks.join("\n\n")}\n</style>`;
    html = /<\/head>/i.test(html) ? html.replace(/<\/head>/i, styleTag+"\n</head>") : styleTag+"\n"+html;
  }
  if(jsBlocks.length){
    const scriptTag = `<script>\n${jsBlocks.join("\n\n")}\n<\/script>`;
    html = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, scriptTag+"\n</body>") : html+"\n"+scriptTag;
  }
  return html;
}

/* ═══════════ ZIP & CANVAS ═══════════ */
const CRC_TABLE = (()=>{ let c,t=new Uint32Array(256); for(let n=0;n<256;n++){ c=n; for(let k=0;k<8;k++) c = c&1 ? 0xedb88320^(c>>>1) : c>>>1; t[n]=c; } return t; })();
function crc32(u8){ let c=0xffffffff; for(let i=0;i<u8.length;i++) c=(c>>>8)^CRC_TABLE[(c^u8[i])&0xff]; return (c^0xffffffff)>>>0; }
function makeZip(files){
  const enc = new TextEncoder(), parts = [], cd = []; let offset = 0;
  for(const f of files){
    const name = enc.encode(f.name), data = typeof f.content === "string" ? enc.encode(f.content) : f.content, crc = crc32(data);
    const lhdr = new Uint8Array(30+name.length), lv = new DataView(lhdr.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint32(14,crc,true);
    lv.setUint32(18,data.length,true); lv.setUint32(22,data.length,true); lv.setUint16(26,name.length,true);
    lhdr.set(name,30); parts.push(lhdr,data);
    const chdr = new Uint8Array(46+name.length), cv = new DataView(chdr.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true); cv.setUint32(42,offset,true);
    chdr.set(name,46); cd.push(chdr);
    offset += lhdr.length+data.length;
  }
  const cdLen = cd.reduce((s,b)=>s+b.length,0), eocd = new Uint8Array(22), ev = new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdLen,true); ev.setUint32(16,offset,true);
  return new Blob([...parts,...cd,eocd],{type:"application/zip"});
}

function deobfuscateAndScanJS(rawCode, sourceName="Bundle"){
  let decoded = rawCode.replace(/\\x([0-9A-Fa-f]{2})/g,(_,h)=>String.fromCharCode(parseInt(h,16)))
                       .replace(/\\u([0-9A-Fa-f]{4})/g,(_,u)=>String.fromCharCode(parseInt(u,16)));
  const beautified = decoded.replace(/;(?=\S)/g,";\n").replace(/\{(?=\S)/g,"{\n").replace(/\}(?=\S)/g,"}\n");
  const out = [];
  const extract = (title, re)=>{
    const m = [...new Set([...decoded.matchAll(re)].map(x=>x[1]||x[0]))].slice(0,30);
    if(m.length) out.push(`### ${title} (${m.length})\n`+m.map(x=>"- `"+x+"`").join("\n"));
  };
  extract("REST API & Admin Routes", /["'](\/(?:api|v[1-5]|admin|internal|auth|graphql|oauth|user|account|webhook)[a-zA-Z0-9_\/.-]*)["']/g);
  extract("Backend URLs", /(https?:\/\/[a-zA-Z0-9.-]+(?::\d+)?\/(?:api|v[1-5]|graphql|admin|auth)[a-zA-Z0-9_\/.?=&-]*)/g);
  extract("DOM XSS Sinks", /(addEventListener\s*\(\s*["']message["']|\.innerHTML\s*=|\.outerHTML\s*=|document\.write\s*\(|eval\s*\(|dangerouslySetInnerHTML)/g);
  extract("Hardcoded Secrets", /(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z\-_]{35}|sk-[a-zA-Z0-9]{20,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})/g);
  return {
    report: out.length ? `## JS De-obfuscation & Endpoint Audit (${sourceName})\n\n`+out.join("\n\n") : `Decoded ${rawCode.length.toLocaleString()} chars — no high-risk sinks found.`,
    beautified: beautified.slice(0,25000)
  };
}

function scanAndroidSource(text, filename="source"){

  const rules = [

    ["HIGH · Exported Components", /(android:exported\s*=\s*["']true["'])/gi],

async function routeStandardLLM(msgs, onTok){
  const m = S.model, chain = [];
  const add = (k,x)=>chain.push([k,x]);
  if(m.startsWith("pl:")) add("pl", m.slice(3));
  else if(m.startsWith("puter:")) add("puter", m.slice(6));
  else if(m.startsWith("gr:")) add("gr", m.slice(3));
  else if(m.startsWith("or:")) add("or", m.slice(3));
  else if(m.startsWith("gm:")) add("gm", m.slice(3));

  // Universal fallback chain so it NEVER fails
  add("gr", "llama-3.3-70b-versatile");
  add("pl", "openai-large");
  add("or", "openrouter/free");
  add("puter", "gpt-4o");
  add("gm", "gemini-2.5-flash");

  for(const [k,mod] of chain){
    if(stop) return "";
    try{
      if(k === "pl") return await callPollinations(msgs, mod, onTok);
      if(k === "puter") return await callPuter(msgs, mod, onTok);
      if(k === "gr") return await callGroq(msgs, mod, onTok);
      if(k === "or") return await callOpenRouter(msgs, mod, onTok);
      if(k === "gm") return await callGemini(msgs, mod, onTok);

async function ask(text){
  text = (text||"").trim();
  if((!text && !attachments.length) || busy) return;
  $("#cmdM").classList.remove("open");
  $("#plusMenu").classList.remove("open");

  let directReelTopic = null, directImgPrompt = null, blitzTargetDomain = null, isWebBuild = false;

  if(text.startsWith("/reel ")){ directReelTopic = text.slice(6).trim(); text = `Create AI video reel: ${directReelTopic}`; }
  else if(text.startsWith("/img ") || /^(?:create|generate|make|draw)\s+(?:an?\s+)?image\s+(?:of\s+)?/i.test(text)){
    directImgPrompt = text.replace(/^\/img\s+/i,"").replace(/^(?:create|generate|make|draw)\s+(?:an?\s+)?image\s+(?:of\s+)?/i,"").trim();
  }else if(text.startsWith("/audit ")){
    blitzTargetDomain = text.slice(7).trim().replace(/^https?:\/\//,"").split("/")[0];
  }else if(text.startsWith("/web ")){
    isWebBuild = true;
    text = `Build a complete single-file responsive HTML+Tailwind web application for: ${text.slice(5).trim()}. Output complete \`\`\`html code.`;
  }

  if(!S.cur || !cur()) newChat(true);
  document.getElementById("hello")?.remove();
  const c = cur();
  const filesCopy = attachments.slice();
  c.msgs.push({ role:"user", content:text, files:filesCopy, ts:Date.now() });
  if(c.title === "New chat") c.title = (text || filesCopy[0]?.name || "Chat").slice(0,34);
  addUser(text, c.msgs.length-1, filesCopy);

  $("#q").value = ""; $("#q").style.height = "auto";
  attachments = []; renderAttachments(); updateSendButtonIcon();
  userScrolledUp = false; bottom(true);
  saveToMemory(text);
  save(); drawList();

  return await runAgent({ directReelTopic, directImgPrompt, blitzTargetDomain, isWebBuild });
}

}

async function runAgent(opts = {}){
  busy = true; stop = false; updateSendButtonIcon();
  const c = cur(); const myIndex = c.msgs.length;
  const row = document.createElement("div"); row.className = "arow";
  const th = document.createElement("details"); th.className = "th"; th.open = !!(S.thinkMode || S.webMode || S.deepMode || opts.directImgPrompt || opts.directReelTopic || opts.blitzTargetDomain);
  th.innerHTML = '<summary><span class="dot"></span><span class="tt">Thinking…</span><span class="tm" style="margin-left:auto">0.0s</span></summary><div class="pbar-wrap"><div class="pbar"></div></div><div class="st"></div>';
  const st = th.querySelector(".st"), pbar = th.querySelector(".pbar");
  const t0 = performance.now();
  const tick = setInterval(()=>th.querySelector(".tm").textContent = ((performance.now()-t0)/1000).toFixed(1)+"s", 100);
  const ans = document.createElement("div"); ans.className = "a";
  row.append(th, ans); $("#in").appendChild(row); bottom();
  const log = s=>{ st.textContent += (st.textContent?"\n":"")+s; };

  const streamRender = t=>{
    const preview = t.replace(TOOLRE_G, "");
    TOOLRE_G.lastIndex = 0;
    ans.innerHTML = md(preview)+'<span class="cur"></span>';
    bottom();
  };

  let used = 0, final = "", preTelemetry = "";
  try{
    const lastUser = c.msgs[c.msgs.length-1];
    const lastText = lastUser?.content || "";

    if(opts.directReelTopic){
      used++; pbar.style.width = "70%";
      const vidId = await generateAIStoryboardVideo(opts.directReelTopic, msg=>{ th.querySelector(".tt").textContent = msg; log("▸ "+msg); });
      final = `Here is your generated AI video reel for **${escapeHtml(opts.directReelTopic)}**:\n\n[[media:${vidId}]]`;
    }else if(opts.directImgPrompt){
      used++; pbar.style.width = "70%";
      th.querySelector(".tt").textContent = "Creating image with FLUX…";
      const res = await tools.image(opts.directImgPrompt);
      const tok = res.match(/\[\[media:m[a-z0-9]+\]\]/)?.[0] || "";
      final = `Here is your generated image for **${escapeHtml(opts.directImgPrompt)}**:\n\n${tok}`;
    }else{
      if(opts.blitzTargetDomain){
        used++; pbar.style.width = "55%";
        tools.recon_graph(opts.blitzTargetDomain);
        const data = await tools.domain_blitz(opts.blitzTargetDomain, msg=>{ th.querySelector(".tt").textContent = msg; log("▸ "+msg); });
        preTelemetry += `\n\n[12-VECTOR RECON TELEMETRY FOR ${opts.blitzTargetDomain}]\n${data}\nProvide a structured Bug Bounty & Security Assessment report.`;
      }
      if(S.webMode){
        used++; pbar.style.width = "45%";
        th.querySelector(".tt").textContent = "Searching the live web…";
        const wData = await tools.websearch(lastText);
        log("▸ Live Web Search completed");
        preTelemetry += `\n\n[LIVE WEB SEARCH RESULTS]\n${wData}`;
      }
      if(S.deepMode){
        used++; pbar.style.width = "55%";
        const dData = await tools.omni_blitz(lastText, msg=>{ th.querySelector(".tt").textContent = msg; log("▸ "+msg); });
        preTelemetry += `\n\n[DEEP RESEARCH 7-NETWORK DATA]\n${dData}`;
      }

      const pastMemory = await queryMemory(lastText).catch(()=>"");
      let sys = sysPrompt() + (pastMemory ? `\n[Relevant Memory]\n${pastMemory}` : "");
      if(S.thinkMode) sys += "\n[THINKING MODE ENABLED]: First break down the problem step-by-step clearly, then provide the comprehensive answer.";

      const work = [{role:"system",content:sys}, ...c.msgs.slice(-12).map(m=>{
        let txt = m.content || "";
        if(m.files?.length) txt += "\n\n" + m.files.map(f=>`[Attached File: ${f.name}]\n${f.text||""}`).join("\n\n");
        return { role:m.role, content:txt };
      })];
      if(preTelemetry) work[work.length-1].content += preTelemetry;

      for(let i=0; i<=MAXSTEPS; i++){
        pbar.style.width = Math.min(92, 40+i*15)+"%";
        th.querySelector(".tt").textContent = i === 0 ? "Generating response…" : `Executing tool step ${i}…`;
        const out = await llm(work, streamRender);
        TOOLRE_G.lastIndex = 0;
        const matches = [...out.matchAll(TOOLRE_G)];
        if(!matches.length || i === MAXSTEPS || stop){
          final = out.replace(TOOLRE_G, "").trim() || out;
          break;
        }
        const results = await Promise.all(matches.map(async m=>{
          const [,name,inp] = m; used++;
          th.querySelector(".tt").textContent = `Running @${name}…`;
          log(`▸ @${name}: `+inp.trim().slice(0,100));
          let res;
          try{ res = await withTimeout(tools[name](inp), 60000, "Tool timeout"); }
          catch(e){ res = "ERROR: "+(e.message||e); }
          return "[TOOL RESULT: "+name+"]\n"+res;
        }));
        work.push({ role:"assistant", content:out }, { role:"user", content:results.join("\n\n") });
      }
    }

    const bundledHtml = bundleWebBlocks(final);
    if(bundledHtml) openCanvas(bundledHtml, "html", "Live App Preview");

    const nowTs = Date.now();
    ans.innerHTML = md(final);
    dress(ans, final);
    addActs(row, final, myIndex, nowTs);
    c.msgs.push({ role:"assistant", content:final, ts:nowTs });
    if(S.autoSpeak && final && !stop) speakText(final, true);
  }catch(e){
    ans.innerHTML = '<span style="color:var(--err)">Error: '+escapeHtml(e.message)+'</span> ';
  }
  clearInterval(tick);
  if(used || S.thinkMode){
    th.classList.add("done"); th.open = false;
    th.querySelector(".tt").textContent = `Thought for `+((performance.now()-t0)/1000).toFixed(1)+"s";
    th.querySelector(".tm").textContent = "";
  }else th.remove();
  busy = false; updateSendButtonIcon();
  save(); drawList(); bottom();
  return final;
}

/* ═══════════ VOICE & ORB ═══════════ */
function speakText(text, force=false){
  if(!force && window.speechSynthesis?.speaking){ speechSynthesis.cancel(); return; }
  if(window.speechSynthesis) speechSynthesis.cancel();
  const clean = text.replace(/```[\s\S]*?```/g," ").replace(/[#*`_~\[\]()>|]/g," ").replace(/https?:\/\/\S+/g," ").replace(/\s+/g," ").trim();
  if(!clean || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(clean.slice(0, 600));
  u.rate = S.voiceRate || 1.0;
  speechSynthesis.speak(u);
}

let orbRec = null, orbActive = false;
function openOrb(){ closeSide(); $("#orbM").classList.add("open"); }
$("#orbCloseBtn").onclick = ()=>{
  orbActive = false; try{ orbRec?.stop(); }catch(_){}
  if(window.speechSynthesis) speechSynthesis.cancel();
  $("#orbCircle").className = "orb"; $("#orbM").classList.remove("open");
};
$("#orbToggleBtn").onclick = $("#orbCircle").onclick = ()=>{
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return toast("Voice recognition not supported in this browser");
  if(orbActive){ orbActive = false; try{ orbRec?.stop(); }catch(_){} $("#orbCircle").className = "orb"; $("#orbToggleBtn").textContent = "Start Listening"; return; }
  orbRec = new SR(); orbRec.lang = "en-IN"; orbActive = true;
  $("#orbCircle").className = "orb listen";
  $("#orbSub").textContent = "Listening…";
  $("#orbToggleBtn").textContent = "Stop";
  orbRec.onresult = async e=>{
    const txt = e.results[0][0].transcript;
    $("#orbSub").textContent = "You: "+txt;
    $("#orbCircle").className = "orb";
    const rep = await ask(txt);
    if(!rep || !$("#orbM").classList.contains("open")) return;
    const clean = rep.replace(/```[\s\S]*?```/g,"").replace(/[#*`_~]/g,"").slice(0,420);
    $("#orbSub").textContent = clean;
    speakText(clean, true);
  };
  orbRec.onend = ()=>{ orbActive = false; $("#orbToggleBtn").textContent = "Start Listening"; };
  orbRec.start();
};

/* ═══════════ SIDEBAR: PINNED, PROJECTS & RECENTS (Matches Screenshot 4) ═══════════ */
function newChat(silent){
  const id = "c"+Date.now();
  S.chats[id] = { id, title:"New chat", msgs:[], pinned:false, ts:Date.now() };
  S.cur = id; save();
  if(!silent){ renderAll(); drawList(); closeSide(); }
}
function openChat(id){ S.cur = id; save(); renderAll(); drawList(); closeSide(); bottom(true); }

function drawList(filter=""){
  const pinEl = $("#pinList"), recEl = $("#list"), projEl = $("#projList");
  pinEl.innerHTML = ""; recEl.innerHTML = ""; projEl.innerHTML = "";
  const q = filter.toLowerCase().trim();

  // Render Projects
  (S.projects || []).forEach((p, idx)=>{
    const d = document.createElement("div"); d.className = "ci";
    d.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span>${escapeHtml(p)}</span>`;
    d.onclick = ()=>{ newChat(); $("#q").value = `[Project: ${p}] `; $("#q").focus(); updateSendButtonIcon(); };
    projEl.appendChild(d);
  });

  // Render Pinned & Recents
  Object.values(S.chats).sort((a,b)=>b.ts-a.ts).forEach(c=>{
    if(!c.msgs.length && c.id !== S.cur) return;
    if(q && !c.title.toLowerCase().includes(q)) return;
    const d = document.createElement("div"); d.className = "ci"+(c.id === S.cur ? " on" : "");
    const s = document.createElement("span"); s.textContent = c.title;
    const acts = document.createElement("div"); acts.className = "ci-acts";
    const pinBtn = document.createElement("button"); pinBtn.className = "ci-btn"; pinBtn.textContent = c.pinned ? "📌" : "📍";
    pinBtn.title = c.pinned ? "Unpin" : "Pin chat";
    pinBtn.onclick = e=>{ e.stopPropagation(); c.pinned = !c.pinned; save(); drawList(q); };
    const delBtn = document.createElement("button"); delBtn.className = "ci-btn"; delBtn.textContent = "✕";
    delBtn.onclick = e=>{ e.stopPropagation(); delete S.chats[c.id]; if(S.cur === c.id){ S.cur = null; renderAll(); } save(); drawList(q); };
    acts.append(pinBtn, delBtn);
    d.onclick = ()=>!busy && openChat(c.id);
    d.append(s, acts);
    if(c.pinned) pinEl.appendChild(d);
    else recEl.appendChild(d);
  });
  if(!pinEl.children.length) pinEl.innerHTML = `<div style="font-size:12.5px;color:var(--m);padding:4px 10px">No pinned chats</div>`;
}

function applyTheme(){
  document.documentElement.setAttribute("data-theme", S.theme === "dark" ? "dark" : "light");
  document.querySelector('meta[name="theme-color"]').setAttribute("content", S.theme === "dark" ? "#000000" : "#ffffff");
}

async function handleFiles(fileList){
  for(const f of fileList){
    if(f.type.startsWith("image/")){
      const b = await normImg(f), id = newId();
      await mPut(id, { b, kind: "image" });
      S.lastImg = id; save();
      const dataUrl = await new Promise(ok=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.readAsDataURL(b); });
      const ocrText = await runOCR(f);
      attachments.push({ name:f.name, imgId:id, dataUrl, text: ocrText ? `[Image OCR Text]:\n${ocrText}` : "[Attached Image]" });
    }else if(f.name.endsWith(".pdf")){
      const pdfText = await readPDF(f);
      attachments.push({ name:f.name, text: pdfText.slice(0, 15000) });
    }else{
      const txt = (await f.text()).slice(0, 15000);
      attachments.push({ name:f.name, text: txt });
    }
  }
  renderAttachments(); updateSendButtonIcon();
}
$("#fin").onchange = e=>{ if(e.target.files.length) handleFiles(e.target.files); e.target.value = ""; };
$("#camIn").onchange = e=>{ if(e.target.files.length) handleFiles(e.target.files); e.target.value = ""; };

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SR){
  const rec = new SR(); rec.lang = "en-IN"; let on = false;
  rec.onresult = e=>{ $("#q").value += (($("#q").value?" ":"")+e.results[0][0].transcript); $("#q").dispatchEvent(new Event("input")); };
  rec.onend = rec.onerror = ()=>{ on = false; $("#mic").classList.remove("rec"); };
  $("#mic").onclick = ()=>{ on ? rec.stop() : rec.start(); on = !on; $("#mic").classList.toggle("rec", on); };
}

applyTheme();
updateModeBadges();
updateSendButtonIcon();
if(S.cur && cur()) openChat(S.cur);
else { hello(); drawList(); }
