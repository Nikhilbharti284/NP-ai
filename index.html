<!DOCTYPE html>
<html lang="en">
<head>

<title>Astra Carbon X v10.0 — Omni-Research & Daily Security OS</title>
<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%23070a0f'/%3E%3Cpath d='M256 64l52 140 140 52-140 52-52 140-52-140-140-52 140-52z' fill='%2310a37f'/%3E%3C/svg%3E">

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>

<style>
:root{
  --bg:#070a0f;--side:#040609;--sur:#10151f;--hov:#192130;
  --b:rgba(255,255,255,.08);--t:#f1f5f9;--m:#8b949e;
  --ac:#10a37f;--ac-glow:rgba(16,163,127,.2);--danger:#ef4444;--warn:#f59e0b;
}
:root[data-theme="light"]{
  --bg:#ffffff;--side:#f8fafc;--sur:#f1f5f9;--hov:#e2e8f0;
  --b:rgba(0,0,0,.08);--t:#0f172a;--m:#64748b;
  --ac:#0d9488;--ac-glow:rgba(13,148,136,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;width:100%;overflow:hidden;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;user-select:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}

/* ===== 60FPS SMOOTH SIDEBAR ===== */
#side{width:270px;background:var(--side);border-right:1px solid var(--b);display:flex;flex-direction:column;flex-shrink:0;z-index:40;will-change:transform;transition:transform .22s cubic-bezier(.22,1,.36,1)}
.brand-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px;gap:6px}
.new-btn{flex:1;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:600;background:var(--sur);border:1px solid var(--b);transition:all .15s}
.new-btn:hover{background:var(--hov);border-color:var(--ac)}
.ssearch{margin:6px 12px;padding:8px 12px;border-radius:10px;background:var(--sur);border:1px solid var(--b);color:var(--t);font-size:13px;outline:0;width:calc(100% - 24px)}
.ssearch:focus{border-color:var(--ac)}
.lab{font-size:10.5px;color:var(--m);padding:10px 16px 4px;text-transform:uppercase;letter-spacing:.7px;font-weight:700}
#list{flex:1;overflow-y:auto;padding:0 8px;-webkit-overflow-scrolling:touch}
.ci{display:flex;align-items:center;padding:9px 12px;border-radius:10px;font-size:13.5px;cursor:pointer;gap:8px;margin-bottom:2px;color:var(--m);transition:background .12s}
.ci:hover{background:var(--sur);color:var(--t)}
.ci.on{background:var(--sur);color:var(--t);font-weight:500}
.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci b{font-weight:400;opacity:.6;padding:0 4px}
.ci b:hover{opacity:1;color:var(--danger)}

.sfoot{padding:8px;border-top:1px solid var(--b);display:flex;flex-direction:column;gap:4px}
details.sdrop{border-radius:10px}
details.sdrop summary{padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;border-radius:10px;color:var(--m)}
details.sdrop summary::-webkit-details-marker{display:none}
details.sdrop summary:hover{background:var(--sur);color:var(--t)}
.sdrop-list{display:flex;flex-direction:column;gap:2px;padding:4px 0 4px 8px;max-height:32vh;overflow-y:auto}
.srow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:12.5px;text-align:left;color:var(--t)}
.srow:hover{background:var(--sur)}
.badge{font-size:9px;background:var(--ac);color:#fff;padding:1.5px 6px;border-radius:99px;margin-left:auto;font-weight:700}

/* ===== GLASSMORPHIC MINIMAL HEADER + DAILY FOCUS TIMER ===== */
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;border-bottom:1px solid var(--b);background:rgba(7,10,15,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:15}
:root[data-theme="light"] header{background:rgba(255,255,255,.86)}
.hleft{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.hright{display:flex;align-items:center;gap:5px;flex-shrink:0}
.hbtn{height:34px;padding:0 9px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;color:var(--m);transition:all .15s}
.hbtn:hover,.hbtn.active{background:var(--sur);color:var(--t)}
#pomoBtn{font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1px solid var(--b);background:var(--sur);color:var(--t);border-radius:99px;padding:0 10px}
#pomoBtn.run{border-color:var(--ac);color:var(--ac)}
.model-pill{display:flex;align-items:center;background:var(--sur);border:1px solid var(--b);border-radius:99px;padding:2px 10px 2px 12px;max-width:52vw}
#model{background:transparent;color:var(--t);border:0;font-weight:600;font-size:13px;outline:0;padding:5px 0;width:100%;text-overflow:ellipsis}
#model option{background:var(--side);color:var(--t)}
#menu{display:none}

/* ===== WORKSPACE & HARDWARE-ACCELERATED CHAT STREAM ===== */
#workspace{flex:1;display:flex;min-height:0;overflow:hidden;position:relative}
#chat{flex:1;overflow-y:auto;padding:18px 14px 28px;min-width:0;-webkit-overflow-scrolling:touch}
#in{max-width:730px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
#jumpBtn{position:absolute;bottom:14px;right:18px;background:var(--sur);border:1px solid var(--b);color:var(--t);width:36px;height:36px;border-radius:50%;display:none;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:20;font-size:15px}
#jumpBtn.show{display:flex}

.urow{display:flex;flex-direction:column;align-items:flex-end;gap:4px;content-visibility:auto}
.u{background:var(--sur);border:1px solid var(--b);padding:11px 16px;border-radius:20px 20px 4px 20px;max-width:86%;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere;font-size:15px}
.fchip{display:inline-block;margin-top:6px;font-size:11.5px;background:var(--ac-glow);color:var(--ac);padding:3px 9px;border-radius:8px;font-weight:600}

.arow{display:flex;flex-direction:column;gap:6px;content-visibility:auto}
.a{line-height:1.7;font-size:15.5px;overflow-wrap:anywhere;min-width:0}
.a p{margin-bottom:12px}.a ul,.a ol{padding-left:22px;margin-bottom:12px}.a a{color:var(--ac);text-decoration:none}.a a:hover{text-decoration:underline}
.a img{max-width:100%;border-radius:12px;margin:6px 0}
.a table{border-collapse:collapse;display:block;overflow-x:auto;margin-bottom:12px;font-size:13.5px}.a td,.a th{border:1px solid var(--b);padding:7px 11px}
.a :not(pre)>code{background:var(--sur);border:1px solid var(--b);padding:1.5px 6px;border-radius:6px;font-size:.86em;font-family:ui-monospace,Menlo,monospace;word-break:break-word}
.acts{display:flex;gap:10px;font-size:12px;color:var(--m);align-items:center;flex-wrap:wrap}
.acts button{padding:3px 7px;border-radius:6px}
.acts button:hover{background:var(--sur);color:var(--t)}

/* ===== AUTO-COLLAPSING COMPACT CODE CARDS ===== */
.cb{margin:12px 0;border:1px solid var(--b);border-radius:13px;overflow:hidden;background:#06090e;box-shadow:0 4px 16px rgba(0,0,0,.22)}
.cbar{display:flex;gap:6px;align-items:center;padding:8px 12px;background:#0e131c;border-bottom:1px solid rgba(255,255,255,.07);flex-wrap:wrap}
.clang{margin-right:auto;font-size:11px;color:#94a3b8;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;font-weight:700}
.cp{font-size:11.5px;background:rgba(255,255,255,.07);color:#e2e8f0;padding:4px 9px;border-radius:7px;font-weight:500;transition:all .15s}
.cp:hover{background:rgba(255,255,255,.15)}
.cp.ac{background:var(--ac);color:#fff}
.cb pre{color:#e6edf3;padding:12px 14px;overflow-x:auto;font-size:12.5px;line-height:1.55;max-height:320px;overflow-y:auto;margin:0}
.cb.collapsed pre{max-height:130px;overflow:hidden;mask-image:linear-gradient(180deg,#000 55%,transparent);-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent)}
.cb-exp{width:100%;text-align:center;padding:7px;font-size:12px;color:var(--ac);background:#0a0e16;border-top:1px solid rgba(255,255,255,.06);font-weight:600;display:none}
.cb.collapsed .cb-exp{display:block}
.cb pre code{background:none;padding:0;font-family:ui-monospace,Menlo,monospace}
.ro{background:#030508;color:#7ee0c3;font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;border-top:1px solid rgba(255,255,255,.08)}
.ro[hidden]{display:none}

/* ===== THINKING PILL ===== */
details.th{border:1px solid var(--b);border-radius:12px;margin-bottom:8px;font-size:12.5px;color:var(--m);background:var(--sur)}
details.th summary{padding:8px 12px;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;font-weight:500}
details.th summary::-webkit-details-marker{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ac);animation:p 1s infinite}
.done .dot{animation:none;background:var(--ac)}
@keyframes p{50%{opacity:.25}}
.st{padding:8px 14px 10px;border-top:1px solid var(--b);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;max-height:190px;overflow-y:auto}
.cur{display:inline-block;width:7px;height:15px;background:var(--ac);vertical-align:middle;margin-left:2px;animation:p .8s infinite}

/* ===== CLEAN HERO EMPTY STATE ===== */
#hello{text-align:center;padding:4vh 12px 0;max-width:610px;margin:0 auto}
.hero-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ac);background:var(--ac-glow);padding:4px 12px;border-radius:99px;margin-bottom:12px}
#hello h1{font-size:24px;font-weight:700;margin-bottom:6px;letter-spacing:-.3px}
#hello p{font-size:13.5px;color:var(--m);margin-bottom:20px;line-height:1.45}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.chips button{border:1px solid var(--b);border-radius:14px;padding:12px 13px;font-size:13px;background:var(--sur);text-align:left;line-height:1.35;display:flex;align-items:flex-start;gap:10px;transition:all .15s}
.chips button:hover{border-color:var(--ac);background:var(--hov);transform:translateY(-1px)}
.chips button i{font-style:normal;font-size:18px;line-height:1}
.chips button div b{display:block;font-size:13px;margin-bottom:2px;color:var(--t)}
.chips button div span{font-size:11.5px;color:var(--m)}
@media(max-width:520px){.chips{grid-template-columns:1fr}#hello{padding-top:2vh}}

/* ===== ULTRA-CLEAN BOTTOM COMPOSER + SLASH PALETTE ===== */
footer{padding:6px 12px calc(10px + env(safe-area-inset-bottom,0px));flex-shrink:0;position:relative}
#activePills{max-width:730px;margin:0 auto 6px;display:flex;gap:6px;flex-wrap:wrap}
.mpill{font-size:11.5px;background:var(--ac-glow);border:1px solid var(--ac);color:var(--ac);padding:3px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;font-weight:600}
.mpill b{cursor:pointer}
#file{max-width:730px;margin:0 auto 6px;display:none}
#file div{display:inline-flex;align-items:center;gap:8px;background:var(--sur);border:1px solid var(--b);border-radius:10px;padding:5px 10px;font-size:12.5px}
#boxWrap{max-width:730px;margin:0 auto;position:relative}

/* SLASH COMMAND POPOVER */
#slashMenu{display:none;position:absolute;bottom:56px;left:0;right:0;max-width:420px;background:var(--side);border:1px solid var(--b);border-radius:14px;padding:6px;box-shadow:0 12px 36px rgba(0,0,0,.5);z-index:50;flex-direction:column;gap:2px}
#slashMenu.open{display:flex}
.sl-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:9px;font-size:13px;text-align:left}
.sl-item:hover{background:var(--sur)}
.sl-item code{color:var(--ac);font-weight:700;font-family:ui-monospace,Menlo,monospace}
.sl-item span{color:var(--m);font-size:11.5px}

#box{background:var(--sur);border-radius:26px;padding:6px 8px;display:flex;align-items:flex-end;gap:6px;border:1px solid var(--b);box-shadow:0 4px 20px rgba(0,0,0,.15);transition:border-color .15s}
#box:focus-within{border-color:var(--ac)}
#cmdBtn{width:36px;height:36px;border-radius:50%;background:var(--hov);color:var(--t);font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s}
#cmdBtn:hover{background:var(--ac);color:#fff;transform:rotate(90deg)}
#box textarea{flex:1;background:none;border:0;outline:0;color:var(--t);font:inherit;font-size:15.5px;resize:none;max-height:130px;padding:7px 2px;line-height:1.4;min-width:0}
#mic{width:36px;height:36px;border-radius:50%;flex-shrink:0;font-size:15px;color:var(--m);display:flex;align-items:center;justify-content:center}
#mic:hover{background:var(--hov);color:var(--t)}
#mic.rec{background:var(--danger);color:#fff}
#send{width:36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}

/* ===== UNIFIED COMMAND CENTER BOTTOM-SHEET MODAL (⌘K / ＋) ===== */
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;backdrop-filter:blur(2px)}
#ov.open{display:block}
.mbk{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.mbk{align-items:center;padding:16px}}
.mbk.open{display:flex}
.mdl{background:var(--side);border:1px solid var(--b);border-radius:20px 20px 0 0;width:100%;max-width:730px;max-height:87dvh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.45)}
@media(min-width:640px){.mdl{border-radius:18px;max-height:85dvh}}
.mtop{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--b);font-size:15px;font-weight:700}
.ttabs{display:flex;gap:5px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--b);flex-shrink:0}
.stab{padding:7px 12px;border-radius:99px;font-size:12.5px;white-space:nowrap;color:var(--m);font-weight:600}
.stab.on{background:var(--ac);color:#fff}
.tpane{padding:16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:480px){.qgrid{grid-template-columns:1fr}}
.qcard{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;background:var(--sur);border:1px solid var(--b);text-align:left;font-size:13px;transition:all .15s}
.qcard:hover,.qcard.on{border-color:var(--ac);background:var(--hov)}
.qcard b{display:block;font-size:13px;color:var(--t)}
.qcard span{font-size:11px;color:var(--m)}
.ti{width:100%;background:var(--sur);border:1px solid var(--b);border-radius:11px;padding:10px 12px;color:var(--t);font:inherit;font-size:13.5px;outline:0}
.ti:focus{border-color:var(--ac)}
textarea.ti{resize:vertical;min-height:85px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.out2{background:#05070a;color:#e6edf3;border-radius:11px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;border:1px solid var(--b)}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row2 button{border:1px solid var(--b);border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:600;background:var(--sur)}
.row2 button:hover{background:var(--hov)}
.row2 button.pri{background:var(--ac);color:#fff;border-color:transparent}
.row2 button.red{background:var(--danger);color:#fff;border-color:transparent}

.cvss-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:500px){.cvss-grid{grid-template-columns:1fr}}
.cvss-box{background:var(--sur);border:1px solid var(--b);border-radius:10px;padding:8px 10px}
.cvss-box label{font-size:11px;color:var(--m);font-weight:700;text-transform:uppercase;display:block;margin-bottom:4px}
.cvss-box select{width:100%;background:var(--side);border:1px solid var(--b);color:var(--t);padding:6px 8px;border-radius:8px;font-size:12.5px}

/* ===== SIDE-BY-SIDE LIVE CANVAS ===== */
#canvasPane{width:50%;border-left:1px solid var(--b);background:var(--side);display:none;flex-direction:column;z-index:25}
#canvasPane.open{display:flex}
.ctop{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--b);gap:6px;flex-wrap:wrap}
.ctop .ctitle{font-size:13px;font-weight:700}
.cbar2{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.cbar2 button{font-size:11.5px;padding:5px 9px;border-radius:8px;border:1px solid var(--b);background:var(--sur);font-weight:500}
.cbar2 button.pri{background:var(--ac);color:#fff;border-color:transparent}
#cBody{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#cFrame{flex:1;width:100%;border:0;background:#fff}
#cCode{flex:1;width:100%;border:0;background:#05070a;color:#e6edf3;font:13px/1.5 ui-monospace,Menlo,monospace;padding:12px;resize:none;outline:0;display:none}
#cTerm{height:150px;background:#020305;color:#7ee0c3;font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px 12px;border-top:1px solid var(--b);overflow:auto;white-space:pre-wrap;display:none}

/* ===== LIVE VOICE ORB ===== */
#orbM{display:none;position:fixed;inset:0;background:radial-gradient(circle at center,#0f172a 0%,#02040a 100%);z-index:80;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;text-align:center;color:#fff}
#orbM.open{display:flex}
.orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#34d399,#10a37f 55%,#1e40af);box-shadow:0 0 60px rgba(16,163,127,.55);animation:orbPulse 2.4s infinite ease-in-out;cursor:pointer}
.orb.listen{background:radial-gradient(circle at 35% 35%,#f87171,#ef4444 55%,#991b1b);box-shadow:0 0 75px rgba(239,68,68,.7)}
.orb.speak{background:radial-gradient(circle at 35% 35%,#60a5fa,#3b82f6 55%,#1d4ed8);box-shadow:0 0 80px rgba(59,130,246,.8)}
@keyframes orbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let nodes=[],edges=[],drag=null;
function resize(){cv.width=cv.clientWidth;cv.height=cv.clientHeight;draw()}
addEventListener('resize',resize);setTimeout(resize,50);

function addNode(id,label,color,r=18){
  if(nodes.some(n=>n.id===id))return;
  const a=Math.random()*Math.PI*2,d=70+Math.random()*130;
  nodes.push({id,label,color,r,x:cv.width/2+Math.cos(a)*d,y:cv.height/2+Math.sin(a)*d});
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='rgba(148,163,184,0.28)';ctx.lineWidth=1.2;
  edges.forEach(([a,b])=>{
    const na=nodes.find(n=>n.id===a),nb=nodes.find(n=>n.id===b);
    if(na&&nb){ctx.beginPath();ctx.moveTo(na.x,na.y);ctx.lineTo(nb.x,nb.y);ctx.stroke()}
  });
  nodes.forEach(n=>{
    ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fillStyle=n.color;ctx.fill();
    ctx.strokeStyle='#0f172a';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#f8fafc';ctx.font='600 11px system-ui';ctx.textAlign='center';
    ctx.fillText(n.label.slice(0,22),n.x,n.y+n.r+13);
  });
}
cv.onpointerdown=e=>{
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;

  if(drag)document.getElementById('info').textContent='Node: '+drag.label+'\\nType: '+drag.id;
};
cv.onpointermove=e=>{if(!drag)return;const r=cv.getBoundingClientRect();drag.x=e.clientX-r.left;drag.y=e.clientY-r.top;draw()};

async function mapTarget(){

  let log='Target: '+d+'\\n';
  try{
    const dns=await fetch('https://dns.google/resolve?name='+encodeURIComponent(d)+'&type=A').then(r=>r.json());
    for(const a of (dns.Answer||[]).slice(0,4)){
      const ip=a.data;addNode('ip:'+ip,ip,'#3b82f6',18);edges.push(['root','ip:'+ip]);draw();
      if(/^\\d+\\.\\d+\\.\\d+\\.\\d+$/.test(ip)){

}

/* ===== PURE JS CRC32 & MULTI-FILE ZIP PACKAGER ===== */
const CRC_TABLE=(()=>{let c,t=new Uint32Array(256);for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c}return t})();
function crc32(u8){let c=0xffffffff;for(let i=0;i<u8.length;i++)c=(c>>>8)^CRC_TABLE[(c^u8[i])&0xff];return (c^0xffffffff)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let offset=0;
  for(const f of files){
    const name=enc.encode(f.name),data=typeof f.content==="string"?enc.encode(f.content):f.content,crc=crc32(data);
    const lhdr=new Uint8Array(30+name.length),lv=new DataView(lhdr.buffer);
    lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint32(14,crc,true);lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);lv.setUint16(26,name.length,true);
    lhdr.set(name,30);parts.push(lhdr,data);
    const chdr=new Uint8Array(46+name.length),cv=new DataView(chdr.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);cv.setUint32(42,offset,true);
    chdr.set(name,46);cd.push(chdr);
    offset+=lhdr.length+data.length;
  }
  const cdLen=cd.reduce((s,b)=>s+b.length,0),eocd=new Uint8Array(22),ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,cdLen,true);ev.setUint32(16,offset,true);
  return new Blob([...parts,...cd,eocd],{type:"application/zip"});
}

function speakText(text){
  if(window.speechSynthesis?.speaking){speechSynthesis.cancel();return}
  const clean=text.replace(/```[\s\S]*?```/g," ").replace(/[#*`_~\[\]()]/g," ").replace(/\s+/g," ").trim().slice(0,420);
  if(clean&&window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance(clean));
}

const md=t=>{let h;try{h=DOMPurify.sanitize(marked.parse(t||"",{breaks:true,gfm:true}))}catch(e){h="<pre>"+escapeHtml(t)+"</pre>"}return h.replace(/\[\[media:(m[a-z0-9]+)\]\]/g,'<div class="mslot" data-id="$1"></div>')};
let userScrolledUp=false;
const chatEl=$("#chat");
chatEl.addEventListener("scroll",()=>{
  const dist=chatEl.scrollHeight-chatEl.scrollTop-chatEl.clientHeight;
  userScrolledUp=dist>120;
  $("#jumpBtn").classList.toggle("show",userScrolledUp);
},{passive:true});
const bottom=(force=false)=>{if(force||!userScrolledUp)chatEl.scrollTop=chatEl.scrollHeight};

function dress(el){
  el.querySelectorAll("pre").forEach(pre=>{
    if(pre.parentElement.classList.contains("cb"))return;
    const code=pre.querySelector("code"),lang=(((code?.className||"").match(/language-([\w+#-]+)/)||[])[1]||"").toLowerCase(),src=pre.innerText;
    if(lang==="mermaid"&&window.mermaid){
      const d=document.createElement("div");d.className="mm";pre.replaceWith(d);
      mermaid.render("m"+Math.random().toString(36).slice(2),src).then(r=>d.innerHTML=r.svg).catch(()=>d.textContent=src);return;
    }
    if(code&&window.hljs)try{hljs.highlightElement(code)}catch(e){}
    const lines=src.split("\n").length;
    const w=document.createElement("div");w.className="cb"+(lines>14?" collapsed":"");
    const bar=document.createElement("div");bar.className="cbar";
    const lbl=document.createElement("span");lbl.className="clang";lbl.textContent=(lang||"code")+" · "+lines+" lines";
    bar.appendChild(lbl);
    const out=document.createElement("div");out.className="ro";out.hidden=true;
    const add=(l,f,cls="")=>{const b=document.createElement("button");b.className="cp "+(cls||"");b.textContent=l;b.onclick=()=>f(b);bar.appendChild(b)};

    if(lang==="html"||src.trim().startsWith("<!DOCTYPE")||src.trim().startsWith("<html")){
      add("🖥️ Canvas",()=>openCanvas(src,"html","Live HTML Preview"),"ac");
      add("🌐 Host",async()=>{out.hidden=false;out.textContent="Deploying…";out.textContent=await tools.cloud_host(src)});
    }else if(PISTON_MAP[lang]||/^(python|py|js|javascript|ts|cpp|c|rust|go|java|bash|sh|php|sql)$/i.test(lang)){
      add("🛠️ Auto-Heal & Run",async()=>{
        out.hidden=false;
        const r=await autoHealCode(lang||"python",pre.innerText,msg=>{out.textContent=msg});
        if(r.code!==pre.innerText){code.textContent=r.code;if(window.hljs)try{hljs.highlightElement(code)}catch(_){}}
        out.textContent=r.output;
      },"ac");
      add("🖥️ Canvas",()=>openCanvas(pre.innerText,lang||"python","Code Editor"));
    }
    add("Copy",b=>{navigator.clipboard.writeText(pre.innerText);b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1200)});
    const exp=document.createElement("button");exp.className="cb-exp";exp.textContent=`▾ Show all ${lines} lines`;
    exp.onclick=()=>{w.classList.toggle("collapsed");exp.textContent=w.classList.contains("collapsed")?`▾ Show all ${lines} lines`:"▴ Collapse code"};
    pre.replaceWith(w);w.append(bar,pre,exp,out);
  });
  fillSlots(el);
  if(window.renderMathInElement)try{renderMathInElement(el,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\(",right:"\\)",display:false}],throwOnError:false})}catch(e){}
}

  const c=cur();if(!c)return;
  const id="c"+Date.now();

async function ask(text){
  text=(text||"").trim();if((!text&&!pending)||busy)return;
  $("#cmdM").classList.remove("open");
  $("#slashMenu").classList.remove("open");

  // Handle Slash Commands
  if(text==="/notes"){openCmd("notes");$("#q").value="";return}
  if(text.startsWith("/audit ")){
    const dom=text.slice(7).trim();
    S.bugMode=true;S.taskMode=true;save();syncModesUI();
    text=`[🛡️ 7-LAYER PASSIVE DOMAIN SECURITY AUDIT]\nTarget Domain: ${dom}\nRun @domain_audit, @recon_graph, and @js_secrets on ${dom}. Analyze DNS/SPF/DMARC, exposed CT subdomains, HTTP security headers, Shodan ports/CVEs, and archived endpoints. Produce a comprehensive security assessment report with CVSS v3.1 scores, CWE classifications, and remediation configurations.`;
  }else if(text.startsWith("/omni ")){
    const query=text.slice(6).trim();
    S.taskMode=true;save();syncModesUI();
    text=`[🌐 OMNI-WEB DEEP RESEARCH & PROBLEM SOLVER]\nProblem / Topic: ${query}\nUse @omni_research and @fetch to gather comprehensive real-time information across the internet, verify any code or math with @auto_verify, and provide a complete, deeply detailed solution.`;
  }else if(text.startsWith("/heal ")){
    const goal=text.slice(6).trim();
    S.autoHeal=true;S.taskMode=true;save();syncModesUI();
    text=`Write and verify code in the cloud using @auto_verify for: ${goal}`;
  }else if(text.startsWith("/graph ")){
    const dom=text.slice(7).trim()||"example.com";
    $("#q").value="";tools.recon_graph(dom);return;
  }

  if(!S.cur||!cur())newChat(true);
  document.getElementById("hello")?.remove();
  const c=cur();
  const file=pending?{name:pending.name,text:pending.text,imgId:pending.imgId}:null;
  c.msgs.push({role:"user",content:text,file});
  if(c.title==="New chat")c.title=(text||file?.name||"Chat").slice(0,34);
  addUser(text,c.msgs.length-1,file);
  $("#q").value="";$("#q").style.height="auto";
  pending=null;$("#file").style.display="none";
  userScrolledUp=false;bottom(true);
  save();drawList();
  return await runAgent();
}

async function regenerate(i){
  if(busy)return;const c=cur();c.msgs=c.msgs.slice(0,i);
  renderAll();save();drawList();await runAgent();
}

function editMsg(i){
  if(busy)return;const c=cur();const m=c.msgs[i];
  c.msgs=c.msgs.slice(0,i);renderAll();
  $("#q").value=m.content;$("#q").dispatchEvent(new Event("input"));$("#q").focus();
  save();drawList();
}

async function runAgent(){
  busy=true;stop=false;$("#send").textContent="■";
  const c=cur();const myIndex=c.msgs.length;
  const row=document.createElement("div");row.className="arow";
  const th=document.createElement("details");th.className="th";
  th.innerHTML='<summary><span class="dot"></span><span class="tt">Autonomous Agent Working…</span><span class="tm" style="margin-left:auto">0.0s</span></summary><div class="st"></div>';
  const st=th.querySelector(".st"),t0=performance.now();
  const tick=setInterval(()=>th.querySelector(".tm").textContent=((performance.now()-t0)/1000).toFixed(1)+"s",100);
  const ans=document.createElement("div");ans.className="a";
  row.append(th,ans);$("#in").appendChild(row);bottom();
  const log=s=>{st.textContent+=(st.textContent?"\n":"")+s};

  // 60FPS RAF THROTTLED STREAM RENDERER (Zero UI Jank)
  let rafId=null,latestText="";
  const streamRender=t=>{
    latestText=t;
    if(rafId)return;
    rafId=requestAnimationFrame(()=>{
      rafId=null;
      const preview=latestText.replace(TOOLRE_G,"");
      ans.innerHTML=md(preview)+'<span class="cur"></span>';
      bottom();
    });
  };

  let used=0,final="";
  try{
    const work=[{role:"system",content:sysPrompt()},...c.msgs.slice(-14).map(toLLM)];
    for(let i=0;i<=MAXSTEPS;i++){
      ans.innerHTML='<span class="cur"></span>';
      const out=await llm(work,streamRender);
      if(rafId){cancelAnimationFrame(rafId);rafId=null}
      const matches=[...out.matchAll(TOOLRE_G)];
      if(!matches.length||i===MAXSTEPS||stop){final=out.replace(TOOLRE_G,"").trim()||out;break}
      ans.innerHTML="";
      const results=await Promise.all(matches.map(async m=>{
        const [,name,inp]=m;used++;
        th.querySelector(".tt").textContent=`Running @${name} (Step ${used})…`;
        log(`▸ @${name}: `+inp.trim().slice(0,140).replace(/\n/g," "));
        let res;
        try{res=await withTimeout(tools[name](inp),65000,"Timeout")}
        catch(e){res="ERROR: "+(e.message||e)}
        log("  → "+String(res).slice(0,200).replace(/\n/g," "));
        return "[TOOL RESULT: "+name+"]\n"+res;
      }));
      work.push({role:"assistant",content:out},{role:"user",content:results.join("\n\n")});
    }
    const htmlMatch=final.match(/```html\s*\n([\s\S]*?<!DOCTYPE html>[\s\S]*?)```/i);
    if(htmlMatch&&!$("#canvasPane").classList.contains("open"))openCanvas(htmlMatch[1],"html","App Preview");
    ans.innerHTML=md(final);dress(ans);addActs(row,final,myIndex);
    c.msgs.push({role:"assistant",content:final});
  }catch(e){
    ans.innerHTML='<span style="color:#ef4444">⚠️ '+escapeHtml(e.message||"Connection error")+'</span> ';
    const rb=document.createElement("button");rb.className="cp";rb.textContent="↻ Retry";rb.onclick=()=>{if(!busy){row.remove();runAgent()}};ans.appendChild(rb);
  }
  clearInterval(tick);
  if(used){th.classList.add("done");th.querySelector(".tt").textContent=`Completed ${used} cloud step${used>1?"s":""} in `+((performance.now()-t0)/1000).toFixed(1)+"s";th.querySelector(".tm").textContent=""}
  else th.remove();
  busy=false;$("#send").textContent="↑";save();drawList();bottom();
  return final;
}

        <div class="cvss-box"><label>Integrity / Availability (I/A)</label><select id="cvIA"><option value="H:0.56">High (H)</option><option value="L:0.22">Low (L)</option><option value="N:0">None (N)</option></select></div>

        <button class="red" id="cvGenBtn">🎯 Draft Full Vulnerability Report</button>

      const iss=1-((1-cV)*(1-iaV)*(1-iaV));
      const impact=6.42*iss,expl=8.22*avV*acV*prV*uiV;
      const score=iss<=0?0:Math.min(10,Math.ceil((impact+expl)*10)/10);
      const sev=score>=9?"CRITICAL":score>=7?"HIGH":score>=4?"MEDIUM":score>0?"LOW":"NONE";
      const vec=`CVSS:3.1/AV:${av}/AC:${ac}/PR:${pr}/UI:${ui}/S:U/C:${c}/I:${ia}/A:${ia}`;
      $("#cvOut").textContent=`${vec} — Score: ${score.toFixed(1)} (${sev})`;

    };

function gmReq(model,method,body,sig,forceAIza){
  const k=getKey(),aiza=forceAIza||k.startsWith("AIza"),sse=method==="streamGenerateContent";
  const u=(aiza?"https://generativelanguage.googleapis.com/v1beta/models/":"https://aiplatform.googleapis.com/v1/publishers/google/models/")+model+":"+method+(sse?"?alt=sse":"")+(aiza?"":(sse?"&":"?")+"key="+encodeURIComponent(k));
  return fetch(u,{method:"POST",headers:aiza?{"Content-Type":"application/json","x-goog-api-key":k}:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:sig});

async function gemini(msgs,model,onTok){
  const sys=msgs.filter(m=>m.role==="system").map(m=>m.content).join("\n"),contents=[];
  for(const m of msgs.filter(m=>m.role!=="system")){
    const parts=[{text:m.content||" "}];
    if(m.img){const r=await mGet(m.img);if(r?.b)parts.push({inlineData:{mimeType:"image/jpeg",data:await b64(await normImg(r.b))}})}
    contents.push({role:m.role==="assistant"?"model":"user",parts});
  }
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),60000);
  try{
    let r=await gmReq(model,"streamGenerateContent",{systemInstruction:{parts:[{text:sys}]},contents},ctl.signal,false);
    if(!r.ok&&!getKey().startsWith("AIza"))r=await gmReq(model,"streamGenerateContent",{systemInstruction:{parts:[{text:sys}]},contents},ctl.signal,true);
    if(!r.ok)throw new Error("Gemini HTTP "+r.status);
    const rd=r.body.getReader(),dec=new TextDecoder();let buf="",t="";
    for(;;){
      const {done,value}=await rd.read();if(done||stop)break;
      buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf("\n"))>=0){
        const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith("data:"))continue;
        try{const j=JSON.parse(line.slice(5));t+=(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||"").join("");onTok(t)}catch(_){}
      }
    }
    if(!t)throw new Error("Empty Gemini reply");
    return t;
  }finally{clearTimeout(to)}
}
