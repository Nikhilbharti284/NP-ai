<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#171717">
    <title>ChatGPT / Dolphin AI – Smart Multimodal AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="./style.css">

    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ==================== SIDEBAR (CHATGPT STYLE) ==================== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <button class="new-chat-row" id="newChatSidebarBtn">
                <span class="logo-circle">🐬</span>
                <span>New Chat</span>
                <span class="edit-icon">✎</span>
            </button>
            <button class="icon-btn mobile-only" id="closeSidebarBtn">✕</button>
        </div>

        <div class="sidebar-section">Explore Tools</div>
        <div class="sidebar-tools">
            <button class="side-tool-item" id="openStudioSidebarBtn">
                <span>🎨</span> <span>AI Photo Studio & Filters</span>
            </button>
            <button class="side-tool-item" id="uploadPhotoSidebarBtn">
                <span>🪄</span> <span>Upload & Edit Gallery Photo</span>
            </button>
            <button class="side-tool-item" id="openSandboxSidebarBtn">
                <span>💻</span> <span>Live HTML/JS Code Runner</span>
            </button>
        </div>

        <div class="sidebar-section">Recent Chats</div>
        <div class="chat-list" id="chatList"></div>

        <div class="sidebar-footer">
            <button class="side-footer-btn" id="themeToggleBtn">
                <span id="themeIcon">☀️</span> <span id="themeText">Light Mode</span>
            </button>
            <button class="side-footer-btn" id="settingsBtn">
                <span>⚙️</span> <span>Settings</span>
            </button>
            <button class="side-footer-btn danger-text" id="clearAllBtn">
                <span>🗑</span> <span>Clear All</span>
            </button>
        </div>
    </aside>

    <!-- ==================== MAIN CHAT AREA ==================== -->
    <div class="main-area">
        <header class="top-nav">
            <div class="nav-left">
                <button class="icon-btn" id="menuBtn" title="Menu">☰</button>
                <select id="modelSelect" class="chatgpt-model-picker">
                    <option value="openai">Dolphin 4o (Vision + Image + Web)</option>
                    <option value="deepseek">DeepSeek V3 / R1 (Coding + Logic)</option>
                    <option value="mistral">Mistral Large (Uncensored Chat)</option>
                    <option value="qwen-coder">Qwen 2.5 Coder 32B</option>
                    <option value="puter-gpt4o">Puter Cloud GPT-4o</option>
                </select>
            </div>
            <div class="nav-right">
                <button class="icon-btn" id="headerStudioBtn" title="Photo Studio">🎨</button>
                <button class="icon-btn" id="newChatBtn" title="New Chat">✎</button>
            </div>
        </header>

        <!-- Settings Drawer -->
        <div class="settings-drawer" id="settingsPanel">
            <div class="settings-box">
                <div class="settings-header">
                    <span>⚙️ Custom Instructions (System Prompt)</span>
                    <label class="voice-check">
                        <input type="checkbox" id="autoVoiceCheck"> 🔊 Auto-Speak Replies
                    </label>
                </div>
                <textarea id="systemPromptInput" rows="3"></textarea>
                <div class="settings-btns">
                    <button class="btn-solid" id="applySettingsBtn">Save</button>
                    <button class="btn-outline" id="resetSettingsBtn">Reset</button>
                    <button class="btn-outline" id="exportBtn">📥 Export Chat</button>
                </div>
            </div>
        </div>

        <!-- Messages Viewport -->
        <main class="chat-viewport" id="chatContainer">
            <div class="chat-stream" id="chatInner"></div>
        </main>

        <!-- ==================== CHATGPT STYLE COMPOSER ==================== -->
        <footer class="composer-wrap">
            <!-- Image Preview Pill when Gallery Photo is Selected -->
            <div class="photo-preview-tray" id="attachmentBar" style="display:none;">
                <div class="preview-thumb-box">
                    <img id="attachedImgThumb" src="" alt="Uploaded">
                    <button class="remove-thumb-btn" id="removeAttachmentBtn">✕</button>
                </div>
                <div class="preview-quick-actions">
                    <span class="preview-hint">Photo ready! Type below or tap a quick action:</span>
                    <div class="preview-pills">
                        <button class="action-pill accent-pill" id="aiEditAttachedBtn">🪄 AI Edit Photo</button>
                        <button class="action-pill" id="animeAttachedBtn">🎌 Make Anime</button>
                        <button class="action-pill" id="cyberAttachedBtn">🌃 Cyberpunk</button>
                        <button class="action-pill" id="ocrAttachedBtn">🔍 Read Text</button>
                        <button class="action-pill" id="studioAttachedBtn">🎛️ Filters</button>
                    </div>
                </div>
            </div>

            <div class="composer-box">
                <textarea id="userInput" rows="1" placeholder="Message Dolphin AI... (Ask anything, upload photo, or say 'create image')"></textarea>

                <div class="composer-bottom-row">
                    <input type="file" id="chatImageUpload" accept="image/*" hidden>

                    <div class="composer-tools-left">
                        <button class="plus-upload-btn" id="attachImgBtn" title="Upload Photo from Gallery">＋</button>
                        <button class="mode-pill" id="createImgModeBtn" title="Toggle Image Generation Mode">
                            <span>🎨</span> <span>Create image</span>
                        </button>
                        <button class="mode-pill" id="webSearchToggleBtn" title="Toggle Live Web Search">
                            <span>🌐</span> <span>Search</span>
                        </button>
                        <button class="mode-pill" id="openStudioQuickBtn" title="Open Photo Editor">
                            <span>🎛️</span> <span>Studio</span>
                        </button>
                    </div>

                    <div class="composer-tools-right">
                        <button class="voice-btn" id="micBtn" title="Voice Input">🎤</button>
                        <button class="send-circle-btn" id="sendBtn" title="Send">↑</button>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- ==================== BUILT-IN PHOTO STUDIO & FILTER EDITOR ==================== -->
    <div class="modal-backdrop" id="studioModal">
        <div class="studio-dialog">
            <div class="modal-top">
                <h3>🎨 Photo Studio & AI Remix</h3>
                <button class="icon-btn" id="closeStudioBtn">✕</button>
            </div>

            <div class="studio-layout">
                <!-- Preview Top -->
                <div class="studio-canvas-side">
                    <div class="canvas-box">
                        <canvas id="editorCanvas" width="768" height="768"></canvas>
                        <div class="canvas-loader" id="studioLoading" style="display:none;">
                            <div class="loader-ring"></div>
                            <span id="studioLoadingText">AI is working on your image...</span>
                        </div>
                    </div>
                    <div class="canvas-action-bar">
                        <input type="file" id="uploadImageInput" accept="image/*" hidden>
                        <button class="btn-outline" id="triggerUploadBtn">📂 Upload Photo</button>
                        <button class="btn-outline" id="downloadStudioImgBtn">📥 Save</button>
                        <button class="btn-solid" id="sendToChatStudioBtn">💬 Send to Chat</button>
                    </div>
                </div>

                <!-- Controls Bottom -->
                <div class="studio-controls-side">
                    <div class="tab-bar">
                        <button class="tab-btn active" data-tab="st-ai">🪄 AI Remix</button>
                        <button class="tab-btn" data-tab="st-filters">🎚️ Filters</button>
                        <button class="tab-btn" data-tab="st-text">✏️ Text & Rotate</button>
                    </div>

                    <div class="tab-pane active" id="st-ai">
                        <textarea id="studioPromptInput" rows="2" placeholder="Describe new image or how to edit uploaded photo..."></textarea>
                        <div class="btn-row">
                            <button class="btn-solid" id="studioGenerateBtn" style="flex:1;">✨ Generate New</button>
                            <button class="btn-accent" id="studioAiRemixBtn" style="flex:1;">🪄 AI Edit Current Photo</button>
                        </div>
                        <div class="preset-grid">
                            <button class="preset-btn" data-prompt="Convert this exact subject and pose into high quality Japanese Anime style">🎌 Anime Style</button>
                            <button class="preset-btn" data-prompt="Transform into futuristic cyberpunk style with glowing neon lights">🌃 Cyberpunk</button>
                            <button class="preset-btn" data-prompt="Keep person identical, change background to snow mountains at sunset">🏔️ Mountain BG</button>
                            <button class="preset-btn" data-prompt="Turn into a 3D Pixar movie character render, 8k detailed">🧊 3D Pixar</button>
                            <button class="preset-btn" data-prompt="Make him wear stylish black sunglasses and a leather jacket, photorealistic">😎 Add Sunglasses</button>
                            <button class="preset-btn" data-prompt="Convert into an artistic pencil sketch portrait">✏️ Pencil Sketch</button>
                        </div>
                    </div>

                    <div class="tab-pane" id="st-filters">
                        <div class="slider-row"><span>Brightness</span><input type="range" id="filterBrightness" min="30" max="180" value="100"></div>
                        <div class="slider-row"><span>Contrast</span><input type="range" id="filterContrast" min="30" max="180" value="100"></div>
                        <div class="slider-row"><span>Saturation</span><input type="range" id="filterSaturation" min="0" max="220" value="100"></div>
                        <div class="slider-row"><span>Warmth/Sepia</span><input type="range" id="filterSepia" min="0" max="100" value="0"></div>
                        <div class="slider-row"><span>Blur</span><input type="range" id="filterBlur" min="0" max="12" value="0" step="0.5"></div>
                        <button class="btn-outline" id="resetFiltersBtn" style="width:100%;margin-top:6px;">♻️ Reset Filters</button>
                    </div>

                    <div class="tab-pane" id="st-text">
                        <div class="btn-row">
                            <button class="btn-outline" style="flex:1" id="rotateImgBtn">🔄 Rotate</button>
                            <button class="btn-outline" style="flex:1" id="flipHImgBtn">↔️ Flip H</button>
                            <button class="btn-outline" style="flex:1" id="flipVImgBtn">↕️ Flip V</button>
                        </div>
                        <div class="btn-row" style="margin-top:8px;">
                            <input type="text" id="overlayTextInput" class="text-inp" placeholder="Add caption on photo...">
                            <input type="color" id="overlayColorInput" value="#ffffff" style="width:36px;height:36px;border:none;background:none;">
                            <button class="btn-solid" id="addTextOverlayBtn">＋ Add</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== LIVE HTML/JS CODE SANDBOX ==================== -->
    <div class="modal-backdrop" id="sandboxModal">
        <div class="studio-dialog sandbox-wide">
            <div class="modal-top">
                <h3>💻 Live Code Preview</h3>
                <div class="btn-row">
                    <button class="btn-solid" id="runSandboxBtn">▶ Run</button>
                    <button class="icon-btn" id="closeSandboxBtn">✕</button>
                </div>
            </div>
            <div class="sandbox-split">
                <textarea id="sandboxCodeEditor" spellcheck="false"></textarea>
                <iframe id="sandboxFrame" sandbox="allow-scripts allow-modals"></iframe>
            </div>
        </div>
    </div>

    <div class="toast-stack" id="toastContainer"></div>

    <script src="./script.js"></script>
</body>
</html>
