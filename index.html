<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Dolphin AI – Chat & Image Editor</title>
<link rel="stylesheet" href="style.css">
<script src="https://js.puter.com/v2/"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header"><div class="sidebar-logo">🐬 Dolphin AI</div><button class="icon-btn" id="sidebarClose">✕</button></div>
  <button class="new-chat-btn" id="newChatBtn">＋ New Chat</button>
  <div class="chat-list" id="chatList"></div>
  <div class="sidebar-footer">
    <button class="sidebar-btn" id="exportBtn">📥 Export current chat</button>
    <button class="sidebar-btn" id="clearBtn">🗑 Clear history</button>
    <button class="sidebar-btn" id="themeBtn">☀️ Toggle theme</button>
  </div>
</aside>
<div class="main-area">
  <header class="header">
    <div class="header-left"><button class="menu-btn" id="menuBtn">☰</button><span class="header-title" id="headerTitle">New Chat</span></div>
    <div class="header-right">
      <select id="modelSelect" class="model-select">
        <option value="deepseek/deepseek-chat">DeepSeek Chat (Puter)</option>
        <option value="gpt-4o-mini">GPT-4o mini (Puter)</option>
        <option value="claude-3-5-sonnet">Claude (Puter)</option>
      </select>
      <button class="icon-btn" id="settingsBtn" title="System prompt">⚙️</button>
    </div>
  </header>
  <section class="settings-panel" id="settingsPanel"><div class="settings-inner">
    <label class="settings-label" for="systemPrompt">System instructions</label>
    <textarea class="settings-textarea" id="systemPrompt">You are a helpful, accurate assistant. Explain technical topics clearly and prioritize safe, authorized use.</textarea>
    <div class="settings-actions"><button class="btn-primary" id="saveSettings">Save</button><button class="btn-secondary" id="closeSettings">Close</button></div>
  </div></section>
  <main class="chat-container" id="chatContainer"><div class="chat-inner" id="chatInner">
    <div class="empty-state"><div class="empty-icon">🐬</div><h2>Dolphin AI</h2><p>Chat assistant · Free image editor interface</p>
    <div class="quick-prompts"><button class="quick-prompt" data-prompt="Explain how image-to-image AI editing works.">🧠 Learn AI editing</button><button class="quick-prompt" data-prompt="Write a Python script to resize images.">💻 Python</button></div></div>
  </div></main>
  <footer class="input-area">
    <div class="input-wrapper">
      <button class="mic-btn" id="imageEditorBtn" title="AI image editor">🎨</button>
      <textarea id="userInput" rows="1" placeholder="Message Dolphin AI..."></textarea>
      <button id="sendBtn" title="Send">↑</button>
    </div>
    <div class="info-bar"><span id="statusText">Ready</span></div>
  </footer>
</div>
<div class="toast-container" id="toastContainer"></div>
<script src="script.js"></script>
</body>
</html>
